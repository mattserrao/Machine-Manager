<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whiteboard Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
    --ok:#16a34a; --bad:#dc2626; --board:#fafaf9; --dot:#d6d3d1;
    color-scheme:light only;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#fff;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background-color:#fff}
  textarea,input{background-color:#fff;color:var(--ink)}

  /* ---------- Board ---------- */
  #board{position:fixed;inset:0;background-color:var(--board);
    background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px;
    touch-action:none;cursor:default}
  #board.panning{cursor:grabbing}
  #world{position:absolute;left:0;top:0;will-change:transform}
  #empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:var(--muted)}
  #empty[hidden]{display:none}
  #empty h1{font-size:20px;font-weight:600;color:#44403c;margin:0 0 6px}
  #empty p{margin:0;font-size:14px}

  /* ---------- Toolbar ---------- */
  #toolbar{position:fixed;top:14px;left:14px;z-index:50;display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 6px;
    box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
  .btn:hover{background:#f5f5f4}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .btn.danger{color:var(--bad);border-color:#fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
  #toolbar .hint{font-size:12px;color:var(--muted);padding-right:6px}
  #saveState{font-size:11px;color:var(--muted);padding-right:8px;min-width:48px}

  /* ---------- Notes ---------- */
  .note{position:absolute;width:236px;background:var(--c);border-radius:10px;
    border:1px solid rgba(0,0,0,.07);
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07);
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
    transition:box-shadow .15s, transform .15s}
  .note:hover{box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.10)}
  .note-body{position:relative;padding:13px 14px 12px;min-height:84px}
  .note.sized .note-body{min-height:0;overflow:hidden}
  .note.sized .text{display:block;-webkit-line-clamp:unset}
  .rz{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;border-radius:3px;opacity:.45;
    background:linear-gradient(135deg,transparent 0 50%,rgba(0,0,0,.45) 50% 56%,transparent 56% 68%,rgba(0,0,0,.45) 68% 74%,transparent 74% 86%,rgba(0,0,0,.45) 86% 92%,transparent 92%)}
  .note:hover .rz{opacity:.9}
  body.is-resizing, body.is-resizing *{cursor:nwse-resize!important}
  .note .title{font-weight:600;font-size:14px;line-height:1.35;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note .text{margin-top:4px;font-size:13px;line-height:1.45;color:#3f3f46;white-space:pre-wrap;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .placeholder{color:rgba(0,0,0,.35);font-style:italic;font-weight:400}
  .atts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .atts img{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid rgba(0,0,0,.08);pointer-events:none}
  .chip{font-size:11px;padding:3px 8px;background:rgba(0,0,0,.06);border-radius:999px;max-width:140px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .count{position:absolute;top:8px;right:9px;font-size:10px;font-weight:600;color:rgba(0,0,0,.45);
    background:rgba(255,255,255,.55);border-radius:999px;padding:1px 6px}

  .tucked{display:flex;flex-direction:column;gap:5px;padding:8px 8px 9px;border-top:1px dashed rgba(0,0,0,.14);
    background:rgba(0,0,0,.025);border-radius:0 0 10px 10px}
  .mini{position:relative;background:var(--c);border-radius:7px;padding:6px 9px 6px 11px;font-size:12px;line-height:1.3;
    border:1px solid rgba(0,0,0,.10);box-shadow:0 1px 3px rgba(0,0,0,.10);cursor:grab;touch-action:none}
  .mini::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;background:rgba(0,0,0,.18)}
  .mini > .row{display:flex;gap:6px;align-items:center}
  .mini .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .mini .ma{font-size:.85em;color:rgba(0,0,0,.5);flex:none}
  .mini:hover{box-shadow:0 2px 6px rgba(0,0,0,.16)}
  /* nested levels get progressively smaller / squished */
  .tucked.sub{padding:4px 0 0 2px;margin-top:4px;border-top:1px dashed rgba(0,0,0,.12);background:none;border-radius:0;gap:3px}
  .mini[data-level="3"]{font-size:11px;padding:3px 7px 3px 9px;border-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .mini[data-level="3"]::before{top:3px;bottom:3px;width:2px}
  .mini[data-level="4"]{font-size:9.5px;line-height:1.2;padding:1px 6px 1px 7px;border-radius:4px;box-shadow:none}
  .mini[data-level="4"]::before{top:2px;bottom:2px;width:2px}
  .mini[data-level="4"] .mt{font-weight:500;opacity:.85}
  .mini.mini-drag{opacity:.3;pointer-events:none}
  .ghost{position:fixed;z-index:400;pointer-events:none;margin:0;opacity:.95;transform:rotate(1.5deg);
    box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .mini.ins-before::after,.mini.ins-after::after{content:"";position:absolute;left:-3px;right:-3px;height:3px;border-radius:2px;
    background:var(--accent);pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
  .mini.ins-before::after{top:-4px}
  .mini.ins-after::after{bottom:-4px}
  .mini.ins-bad::after{background:var(--bad)}

  /* expanded main note while something is dragged over it */
  .mini,.tucked{transition:padding .18s ease,gap .18s ease,font-size .18s ease,margin .18s ease,background-color .18s ease}
  .note.expanded{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px}
  .note.expanded > .tucked{gap:7px;padding:10px;background:rgba(37,99,235,.05)}
  .note.expanded .tucked.sub{padding:7px 0 3px 12px;margin-top:6px;gap:6px}
  .note.expanded .mini{font-size:12px;line-height:1.3;padding:7px 10px 7px 12px;border-radius:7px}
  .note.expanded .mini > .row{min-height:20px}
  .mini.drop-into{outline:2px solid var(--ok);outline-offset:1px}
  .mini.drop-bad{outline:2px solid var(--bad);outline-offset:1px}
  .mini.drop-into > .row::after{content:"↳ drop inside";font-size:10px;font-weight:600;color:var(--ok);flex:none}
  .mini.drop-bad > .row::after{content:attr(data-why);font-size:10px;font-weight:600;color:var(--bad);flex:none}
  .note.dragging{pointer-events:none}
  .note.dragging.shrunk{transform:translate(18px,16px) scale(.42);opacity:.6;transition:transform .15s ease,opacity .15s ease}

  .note.dragging{cursor:grabbing;transform:rotate(1.2deg) scale(1.02);opacity:.94;transition:none;
    box-shadow:0 2px 4px rgba(0,0,0,.08),0 22px 44px rgba(0,0,0,.18)}
  body.is-dragging, body.is-dragging *{cursor:grabbing!important}
  .note.join-ok{outline:2px solid var(--ok);outline-offset:3px}
  .note.join-full{outline:2px solid var(--bad);outline-offset:3px}
  .note.join-ok::after,.note.join-full::after{position:absolute;left:10px;right:10px;bottom:-36px;height:28px;border-radius:8px;
    display:grid;place-items:center;font-size:12px;font-weight:600;pointer-events:none}
  .note.join-ok::after{content:"Drop to tuck in";border:2px dashed var(--ok);color:var(--ok);background:rgba(22,163,74,.08)}
  .note.join-full::after{content:attr(data-why);border:2px dashed var(--bad);color:var(--bad);background:rgba(220,38,38,.07)}
  @keyframes popout{0%{transform:scale(.7)}70%{transform:scale(1.04)}100%{transform:scale(1)}}

  /* ---------- Editor ---------- */
  .backdrop{position:fixed;inset:0;z-index:100;background:rgba(24,24,27,.28);display:grid;place-items:center;padding:20px}
  .backdrop[hidden]{display:none}
  .sheet{width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:#fff;border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--c)}
  .swatches{display:flex;gap:6px}
  .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0}
  .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
  #edLabel{font-size:12px;color:rgba(0,0,0,.55);flex:1;text-align:right}
  .x{border:0;background:transparent;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px;color:rgba(0,0,0,.6)}
  .x:hover{background:rgba(0,0,0,.07)}
  .sheet-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
  #edText{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;
    font:inherit;font-size:14px;line-height:1.5;outline:none}
  #edText:focus{border-color:#a8a29e}
  .drop{border:1.5px dashed #d6d3d1;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px}
  .drop.over{border-color:var(--accent);background:#eff6ff}
  .drop-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  #edAtts{display:flex;flex-wrap:wrap;gap:8px}
  #edAtts:empty{display:none}
  .att{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 26px 6px 6px;
    max-width:100%;background:#fff;font-size:12px}
  .att img{width:56px;height:56px;object-fit:cover;border-radius:5px;cursor:zoom-in;display:block}
  .att .ic{width:36px;height:36px;border-radius:6px;background:#f5f5f4;display:grid;place-items:center;font-size:10px;font-weight:600;color:#57534e;text-transform:uppercase}
  .att .meta{min-width:0}
  .att .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .att .sz{color:var(--muted);font-size:11px}
  .att .sz a{color:var(--accent);text-decoration:none;margin-left:6px}
  .att .rm{position:absolute;top:3px;right:3px;border:0;background:transparent;font-size:14px;color:#a8a29e;padding:2px 5px;border-radius:5px}
  .att .rm:hover{color:var(--bad);background:#fef2f2}
  #edTucked{display:flex;flex-direction:column;gap:6px}
  #edTucked:empty{display:none}
  #edTucked .lbl{font-size:12px;color:var(--muted);font-weight:500}
  .trow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--c);font-size:13px}
  .trow .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .btn{padding:3px 8px;font-size:12px;background:rgba(255,255,255,.7)}
  .sheet-foot{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
  .spacer{flex:1}

  #lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);display:grid;place-items:center;cursor:zoom-out}
  #lightbox[hidden]{display:none}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:300;
    background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:9px;transition:.2s;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){ #toolbar .hint{display:none} }
</style>
</head>
<body>
<div id="board">
  <div id="world"></div>
  <div id="empty"><div><h1>Blank whiteboard</h1><p>Double-click anywhere or press <b>+ New note</b> to start.</p></div></div>
</div>

<div id="toolbar">
  <button id="newBtn" class="btn primary">+ New note</button>
  <button id="centerBtn" class="btn" title="Reset view">Recenter</button>
  <span class="hint">Drop a note on another’s bottom edge, or hover over a stacked note to open it and place it at any level (3 per note, 4 levels deep).</span>
  <span id="saveState"></span>
</div>

<div id="modal" class="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Edit note">
    <div class="sheet-head">
      <div class="swatches" id="edSwatches"></div>
      <span id="edLabel"></span>
      <button class="x" id="edClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <textarea id="edText" placeholder="Write something… (first line becomes the title)"></textarea>
      <div class="drop" id="edDrop">
        <div id="edAtts"></div>
        <div class="drop-row">
          <label class="btn">+ Attach files<input type="file" id="edFile" multiple hidden></label>
          <span>or drop / paste files here</span>
        </div>
      </div>
      <div id="edTucked"></div>
    </div>
    <div class="sheet-foot">
      <button id="edDelete" class="btn danger">Delete note</button>
      <button id="edDetach" class="btn">Pop out of stack</button>
      <span class="spacer"></span>
      <button id="edDone" class="btn primary">Done</button>
    </div>
  </div>
</div>

<div id="lightbox" hidden><img alt=""></div>
<div id="toast"></div>

<script>
(() => {
  const MAX_TUCK = 3;      // subnotes per note, at every level
  const MAX_DEPTH = 4;     // main note = level 1
  const DEFAULT_W = 236;
  const COLORS = ['#ffffff','#fff4b8','#ffd8e1','#d4ecff','#d9f3d3','#e9e0ff','#ffe2c4'];

  const board = document.getElementById('board');
  const world = document.getElementById('world');
  const emptyEl = document.getElementById('empty');
  const saveStateEl = document.getElementById('saveState');

  let state = { notes:{}, pan:{x:0,y:0}, z:1 };
  const N = id => state.notes[id];

  /* ---------------- Storage (IndexedDB, this browser only) ---------------- */
  const store = (() => {
    let dbp = null;
    function open(){
      if (dbp) return dbp;
      dbp = new Promise((res, rej) => {
        try {
          const r = indexedDB.open('whiteboard-notes', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      });
      return dbp;
    }
    async function get(k){
      const db = await open();
      return new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    }
    async function set(k, v){
      const db = await open();
      return new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
      });
    }
    return { get, set };
  })();

  let saveTimer = null, storageOk = true;
  function save(){
    clearTimeout(saveTimer);
    saveStateEl.textContent = storageOk ? 'Saving…' : 'Not saved';
    saveTimer = setTimeout(async () => {
      try { await store.set('board', state); storageOk = true; saveStateEl.textContent = 'Saved'; }
      catch (e) { storageOk = false; saveStateEl.textContent = 'Not saved'; toast('Couldn’t save in this browser — changes last until you close the page.'); }
    }, 350);
  }

  /* ---------------- Helpers ---------------- */
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const urlCache = new Map();
  function urlFor(att){
    if (!urlCache.has(att.id)) { try { urlCache.set(att.id, URL.createObjectURL(att.blob)); } catch(e){ return ''; } }
    return urlCache.get(att.id);
  }
  const isImg = a => /^image\//.test(a.type || '');
  const ext = name => { const m = /\.([a-z0-9]{1,5})$/i.exec(name || ''); return m ? m[1] : 'file'; };
  const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(0) + ' KB' : (b/1048576).toFixed(1) + ' MB';
  function splitText(t){
    const s = (t || '').trim();
    if (!s) return { title:'', rest:'' };
    const i = s.indexOf('\n');
    return i < 0 ? { title:s, rest:'' } : { title:s.slice(0, i).trim(), rest:s.slice(i + 1).trim() };
  }
  let toastT;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }
  // tree helpers
  const heightOf = n => 1 + Math.max(0, ...n.children.map(id => N(id) ? heightOf(N(id)) : 0));
  const levelOf = n => { let l = 1; while (n.parent && N(n.parent)){ n = N(n.parent); l++; } return l; };
  const rootOf = n => { while (n.parent && N(n.parent)) n = N(n.parent); return n; };
  let lastSoft = '';
  function toastSoft(msg){ if (msg !== lastSoft){ lastSoft = msg; toast(msg); setTimeout(() => { lastSoft = ''; }, 1500); } }
  function toWorld(cx, cy){
    const r = board.getBoundingClientRect();
    return { x: cx - r.left - state.pan.x, y: cy - r.top - state.pan.y };
  }

  /* ---------------- Rendering ---------------- */
  function applyPan(){
    world.style.transform = `translate(${state.pan.x}px,${state.pan.y}px)`;
    board.style.backgroundPosition = `${state.pan.x}px ${state.pan.y}px`;
  }

  function render(){
    applyPan();
    world.textContent = '';
    const tops = Object.values(state.notes).filter(n => !n.parent).sort((a, b) => a.z - b.z);
    for (const n of tops) world.appendChild(buildNote(n));
    emptyEl.hidden = tops.length > 0;
  }

  function buildNote(n){
    const e = el('div', 'note');
    e.dataset.id = n.id;
    e.style.left = n.x + 'px'; e.style.top = n.y + 'px'; e.style.zIndex = n.z;
    e.style.width = (n.w || DEFAULT_W) + 'px';
    e.style.setProperty('--c', n.color);

    const body = el('div', 'note-body');
    if (n.h){ e.classList.add('sized'); body.style.height = n.h + 'px'; }
    const { title, rest } = splitText(n.text);
    if (title) body.appendChild(el('div', 'title', title));
    else body.appendChild(el('div', 'title placeholder', 'Empty note — click to edit'));
    if (rest) body.appendChild(el('div', 'text', rest));
    if (n.attachments.length) body.appendChild(buildAttRow(n.attachments));
    const rz = el('div', 'rz'); rz.title = 'Drag to resize';
    rz.addEventListener('pointerdown', ev => startResize(ev, n.id));
    body.appendChild(rz);
    e.appendChild(body);

    if (n.children.length){
      const t = el('div', 'tucked');
      t.dataset.parent = n.id;
      for (const cid of n.children){ const c = N(cid); if (c) t.appendChild(buildMini(c, 2)); }
      e.appendChild(t);
      e.appendChild(el('div', 'count', `${n.children.length}/${MAX_TUCK}`));
    }
    e.addEventListener('pointerdown', ev => startPointer(ev, n.id, false));
    return e;
  }

  function buildAttRow(atts){
    const row = el('div', 'atts');
    const imgs = atts.filter(isImg), files = atts.filter(a => !isImg(a));
    imgs.slice(0, 4).forEach(a => { const i = el('img'); i.src = urlFor(a); i.alt = a.name; row.appendChild(i); });
    files.slice(0, 2).forEach(a => row.appendChild(el('span', 'chip', '📎 ' + a.name)));
    const more = Math.max(0, imgs.length - 4) + Math.max(0, files.length - 2);
    if (more) row.appendChild(el('span', 'chip', '+' + more));
    return row;
  }

  function buildMini(c, level){
    const m = el('div', 'mini');
    m.dataset.id = c.id;
    m.dataset.level = level;
    m.style.setProperty('--c', c.color);
    const row = el('div', 'row');
    const { title } = splitText(c.text);
    row.appendChild(el('span', 'mt' + (title ? '' : ' placeholder'), title || 'Empty note'));
    if (c.attachments.length) row.appendChild(el('span', 'ma', '📎' + c.attachments.length));
    m.appendChild(row);
    if (c.children.length){
      const t = el('div', 'tucked sub');
      t.dataset.parent = c.id;
      for (const cid of c.children){ const k = N(cid); if (k) t.appendChild(buildMini(k, level + 1)); }
      m.appendChild(t);
    }
    m.addEventListener('pointerdown', ev => { ev.stopPropagation(); startPointer(ev, c.id, true); });
    return m;
  }

  /* ---------------- Create / delete ---------------- */
  function createNote(x, y){
    const n = { id:uid(), x:Math.round(x), y:Math.round(y), z:++state.z,
      color:COLORS[0], text:'', attachments:[], children:[], parent:null };
    state.notes[n.id] = n;
    render(); save();
    return n;
  }
  function newNoteInView(){
    const r = board.getBoundingClientRect();
    const w = toWorld(r.left + r.width/2, r.top + r.height/2);
    const jitter = () => (Math.random() - .5) * 60;
    const n = createNote(w.x - DEFAULT_W/2 + jitter(), w.y - 70 + jitter());
    openEditor(n.id);
  }
  function deleteNote(id){
    const n = N(id); if (!n) return;
    const root = rootOf(n);
    if (n.parent){ const p = N(n.parent); if (p) p.children = p.children.filter(c => c !== id); }
    // its subnotes (with their own subnotes) are released to the board, not deleted
    n.children.forEach((cid, i) => {
      const c = N(cid); if (!c) return;
      c.parent = null; c.x = root.x + 20 + i * 28; c.y = root.y + 40 + i * 28; c.z = ++state.z;
    });
    n.attachments.forEach(a => { const u = urlCache.get(a.id); if (u) { URL.revokeObjectURL(u); urlCache.delete(a.id); } });
    delete state.notes[id];
    render(); save();
  }
  function detach(id){
    const n = N(id); if (!n || !n.parent) return;
    const root = rootOf(n);
    const p = N(n.parent);
    const idx = p.children.indexOf(id);
    p.children.splice(idx, 1);
    n.parent = null; n.x = root.x + (root.w || DEFAULT_W) + 24; n.y = root.y + idx * 30; n.z = ++state.z;
    render(); save();
  }

  /* ---------------- Drop targeting ---------------- */
  // A target is { kind:'into'|'line', parent, index, el }
  //  into = become the last subnote of `parent`;  line = insert into `parent` at `index`
  function dropBlock(dragId, parentId){
    const d = N(dragId), P = N(parentId);
    for (let x = P; x; x = x.parent ? N(x.parent) : null) if (x.id === dragId) return 'Can’t drop into itself';
    if (P.children.filter(c => c !== dragId).length >= MAX_TUCK) return `Full — ${MAX_TUCK} max`;
    if (levelOf(P) + heightOf(d) > MAX_DEPTH) return `Too deep — ${MAX_DEPTH} levels max`;
    return null;
  }

  function applyDrop(dragId, tgt, fromRect){
    const d = N(dragId), P = N(tgt.parent);
    let idx = tgt.kind === 'into' ? P.children.length : tgt.index;
    if (d.parent){
      const op = N(d.parent), oi = op.children.indexOf(d.id);
      op.children.splice(oi, 1);
      if (op.id === P.id && oi < idx) idx--;
    }
    idx = Math.max(0, Math.min(idx, P.children.length));
    P.children.splice(idx, 0, d.id);
    d.parent = P.id;
    rootOf(P).z = ++state.z;
    render(); save();

    const m = world.querySelector(`.mini[data-id="${d.id}"]`);
    if (m && m.animate && fromRect){
      const r = m.getBoundingClientRect();
      m.animate([
        { transform:`translate(${fromRect.left - r.left}px,${fromRect.top - r.top}px) scale(1.1)`, opacity:.5 },
        { transform:'translate(0,0) scale(1.05)', opacity:1, offset:.7 },
        { transform:'none', opacity:1 }
      ], { duration:340, easing:'cubic-bezier(.2,.8,.3,1.15)' });
    }
    const te = world.querySelector(`.note[data-id="${rootOf(P).id}"]`);
    if (te && te.animate) te.animate([{ transform:'scale(1)' }, { transform:'scale(1.02)' }, { transform:'scale(1)' }],
      { duration:240, delay:200, easing:'ease-out' });
  }

  // Where inside an expanded main note is the pointer pointing?
  function pointTarget(e, rootEl){
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    if (!hit || !rootEl.contains(hit)) return null;
    const mini = hit.closest('.mini');
    if (mini && rootEl.contains(mini)){
      const id = mini.dataset.id, n = N(id);
      const row = mini.querySelector(':scope > .row');
      const rowR = row.getBoundingClientRect();
      const i = N(n.parent).children.indexOf(id);
      const y = e.clientY, edge = Math.max(6, rowR.height * 0.3);
      if (row.contains(hit) || hit === mini){
        if (y < rowR.top + edge) return { kind:'line', parent:n.parent, index:i };
        if (!n.children.length && y > rowR.bottom - edge) return { kind:'line', parent:n.parent, index:i + 1 };
        return { kind:'into', parent:id, el:mini };
      }
      return { kind:'into', parent:id, el:mini };   // in its nested area padding
    }
    return { kind:'into', parent:rootEl.dataset.id, el:rootEl };
  }

  let curKey = '';
  function clearIndicators(){
    world.querySelectorAll('.join-ok,.join-full,.drop-into,.drop-bad,.ins-before,.ins-after,.ins-bad')
      .forEach(x => x.classList.remove('join-ok','join-full','drop-into','drop-bad','ins-before','ins-after','ins-bad'));
    curKey = '';
  }
  function setTarget(tgt){
    const key = tgt ? `${tgt.kind}|${tgt.parent}|${tgt.index}` : '';
    if (key === curKey) return;
    clearIndicators();
    curKey = key;
    ptr.tgt = tgt;
    if (!tgt) return;
    const why = dropBlock(ptr.id, tgt.parent);
    tgt.ok = !why; tgt.why = why;
    if (tgt.kind === 'into'){
      const elx = tgt.el;
      if (why) elx.dataset.why = why;
      if (elx.classList.contains('note')) elx.classList.add(why ? 'join-full' : 'join-ok');
      else elx.classList.add(why ? 'drop-bad' : 'drop-into');
    } else {
      const pEl = world.querySelector(`.note[data-id="${tgt.parent}"]`) || world.querySelector(`.mini[data-id="${tgt.parent}"]`);
      const cont = pEl && pEl.querySelector(':scope > .tucked');
      if (!cont) return;
      const kids = [...cont.querySelectorAll(':scope > .mini')];
      const k = kids[tgt.index] || kids[kids.length - 1];
      if (!k) return;
      k.classList.add(kids[tgt.index] ? 'ins-before' : 'ins-after');
      if (why){ k.classList.add('ins-bad'); toastSoft(why); }
    }
  }

  function expand(rootEl){
    if (ptr.exp === rootEl) return;
    collapse();
    ptr.exp = rootEl;
    rootEl.classList.add('expanded');
    if (ptr.el && ptr.mode === 'note'){
      ptr.el.style.transformOrigin = `${ptr.offX}px ${ptr.offY}px`;
      ptr.el.classList.add('shrunk');
    }
  }
  function collapse(){
    if (!ptr || !ptr.exp) return;
    ptr.exp.classList.remove('expanded');
    ptr.exp = null;
    if (ptr.el) ptr.el.classList.remove('shrunk');
    clearIndicators(); ptr.tgt = null;
  }
  function near(elx, e, m){
    const r = elx.getBoundingClientRect();
    return e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m + 30;
  }

  /* ---------------- Dragging ---------------- */
  // ptr.mode: null (pending click), 'note' (moving a top-level note), 'mini' (moving a subnote inside its main note)
  let ptr = null;
  let panPtr = null;
  let rsz = null;

  function startPointer(e, id, isChild){
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    ptr = { id, isChild, sx:e.clientX, sy:e.clientY, mode:null, el:null, offX:0, offY:0, tgt:null, exp:null, hoverId:null, hoverT:0 };
  }

  // --- subnote being moved within its main note (any level, any position) ---
  function beginMini(e){
    const m = world.querySelector(`.mini[data-id="${ptr.id}"]`);
    const r = m.getBoundingClientRect();
    ptr.mode = 'mini';
    ptr.mEl = m;
    ptr.rootEl = m.closest('.note');
    ptr.gOffX = e.clientX - r.left; ptr.gOffY = e.clientY - r.top;
    const g = m.cloneNode(true);
    g.classList.add('ghost'); g.style.width = r.width + 'px';
    document.body.appendChild(g);
    ptr.ghost = g;
    m.classList.add('mini-drag');
    document.body.classList.add('is-dragging');
    expand(ptr.rootEl);
  }
  function moveMini(e){
    ptr.ghost.style.left = (e.clientX - ptr.gOffX) + 'px';
    ptr.ghost.style.top = (e.clientY - ptr.gOffY) + 'px';
    if (!near(ptr.rootEl, e, 20)){
      // pulled out of the main note: becomes its own note, keep dragging
      ptr.ghost.remove(); ptr.ghost = null;
      collapse();
      beginDrag(e);
      moveDrag(e);
      return;
    }
    setTarget(pointTarget(e, ptr.rootEl));
  }
  function endMini(){
    const p = ptr;
    const tgt = p.tgt, fromRect = p.ghost ? p.ghost.getBoundingClientRect() : null;
    if (p.ghost) p.ghost.remove();
    collapse(); ptr = null;
    document.body.classList.remove('is-dragging');
    if (tgt && tgt.ok) applyDrop(p.id, tgt, fromRect);
    else { if (tgt && tgt.why) toast('Can’t place it there: ' + tgt.why + '.'); render(); }
  }

  // --- top-level note drag (also used when a subnote is pulled out) ---
  function beginDrag(e){
    const n = N(ptr.id);
    const w = toWorld(e.clientX, e.clientY);
    if (ptr.isChild){
      const m = world.querySelector(`.mini[data-id="${n.id}"]`);
      const mr = m.getBoundingClientRect();
      const p = N(n.parent);
      p.children = p.children.filter(c => c !== n.id);
      n.parent = null;
      ptr.offX = Math.max(10, Math.min(ptr.gOffX || (e.clientX - mr.left), (n.w || DEFAULT_W) - 20));
      ptr.offY = Math.max(8, Math.min(ptr.gOffY || 15, 30));
      n.x = w.x - ptr.offX; n.y = w.y - ptr.offY; n.z = ++state.z;
      render();
      ptr.el = world.querySelector(`.note[data-id="${n.id}"]`);
      ptr.el.style.animation = 'popout .22s ease-out';
    } else {
      ptr.offX = w.x - n.x; ptr.offY = w.y - n.y;
      n.z = ++state.z;
      ptr.el = world.querySelector(`.note[data-id="${n.id}"]`);
      ptr.el.style.zIndex = n.z;
    }
    ptr.el.classList.add('dragging');
    document.body.classList.add('is-dragging');
    ptr.mode = 'note';
    ptr.exp = null; ptr.tgt = null; curKey = '';
  }

  // old rule: dragged note's top edge across another note's bottom edge
  function bottomOverlap(){
    const dr = ptr.el.getBoundingClientRect();
    let best = null, bestScore = -Infinity;
    for (const te of world.querySelectorAll(':scope > .note')){
      if (te === ptr.el) continue;
      const r = te.getBoundingClientRect();
      const hOverlap = Math.min(dr.right, r.right) - Math.max(dr.left, r.left);
      if (hOverlap < Math.min(dr.width, r.width) * 0.35) continue;
      if (dr.top < r.top + r.height * 0.45 || dr.top > r.bottom + 26) continue;
      const score = hOverlap - Math.abs(dr.top - r.bottom) * 2;
      if (score > bestScore){ bestScore = score; best = te; }
    }
    return best;
  }

  function moveDrag(e){
    const n = N(ptr.id);
    const w = toWorld(e.clientX, e.clientY);
    n.x = Math.round(w.x - ptr.offX); n.y = Math.round(w.y - ptr.offY);
    ptr.el.style.left = n.x + 'px'; ptr.el.style.top = n.y + 'px';

    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const hoverRoot = hit ? hit.closest('#world > .note') : null;
    const best = ptr.exp ? null : bottomOverlap();

    if (ptr.exp && ptr.exp !== hoverRoot && !near(ptr.exp, e, 24)) collapse();

    if (!ptr.exp){
      if (best && N(best.dataset.id).children.length) expand(best);
      else if (hoverRoot && N(hoverRoot.dataset.id).children.length){
        // hover briefly over a note with subnotes to open it up
        const now = performance.now();
        if (ptr.hoverId !== hoverRoot.dataset.id){ ptr.hoverId = hoverRoot.dataset.id; ptr.hoverT = now; }
        else if (now - ptr.hoverT > 220) expand(hoverRoot);
      } else ptr.hoverId = null;
    }

    if (ptr.exp) setTarget(pointTarget(e, ptr.exp) || { kind:'into', parent:ptr.exp.dataset.id, el:ptr.exp });
    else if (best) setTarget({ kind:'into', parent:best.dataset.id, el:best });
    else setTarget(null);
  }

  function endDrag(){
    const p = ptr;
    const tgt = p.tgt;
    const fromRect = p.el.getBoundingClientRect();
    collapse(); clearIndicators();
    ptr = null;
    document.body.classList.remove('is-dragging');
    if (tgt && tgt.ok) applyDrop(p.id, tgt, fromRect);
    else {
      if (tgt && tgt.why) toast('Can’t place it there: ' + tgt.why + '.');
      render(); save();
    }
  }

  // --- resize ---
  function startResize(e, id){
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const n = N(id);
    const noteEl = world.querySelector(`.note[data-id="${id}"]`);
    const body = noteEl.querySelector('.note-body');
    rsz = { id, sx:e.clientX, sy:e.clientY, w:noteEl.offsetWidth, h:body.offsetHeight, noteEl, body };
    noteEl.classList.add('sized');
    noteEl.style.zIndex = n.z = ++state.z;
    document.body.classList.add('is-resizing');
  }
  function moveResize(e){
    const n = N(rsz.id);
    n.w = Math.round(Math.max(170, Math.min(720, rsz.w + e.clientX - rsz.sx)));
    n.h = Math.round(Math.max(48, Math.min(900, rsz.h + e.clientY - rsz.sy)));
    rsz.noteEl.style.width = n.w + 'px';
    rsz.body.style.height = n.h + 'px';
  }

  window.addEventListener('pointermove', e => {
    if (panPtr){
      state.pan.x = panPtr.px + (e.clientX - panPtr.sx);
      state.pan.y = panPtr.py + (e.clientY - panPtr.sy);
      applyPan();
      return;
    }
    if (rsz){ moveResize(e); return; }
    if (!ptr) return;
    if (!ptr.mode){
      if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) < 5) return;
      if (ptr.isChild) beginMini(e); else beginDrag(e);
    }
    if (ptr.mode === 'mini') moveMini(e);
    else moveDrag(e);
  });

  window.addEventListener('pointerup', () => {
    if (panPtr){ panPtr = null; board.classList.remove('panning'); save(); return; }
    if (rsz){ rsz = null; document.body.classList.remove('is-resizing'); render(); save(); return; }
    if (!ptr) return;
    if (!ptr.mode){ const id = ptr.id; ptr = null; openEditor(id); return; }
    if (ptr.mode === 'mini') endMini(); else endDrag();
  });
  window.addEventListener('pointercancel', () => {
    if (panPtr){ panPtr = null; board.classList.remove('panning'); }
    if (rsz){ rsz = null; document.body.classList.remove('is-resizing'); render(); save(); }
    if (ptr){ if (ptr.mode === 'mini') endMini(); else if (ptr.mode) endDrag(); else ptr = null; }
  });

  /* ---------------- Board: pan + double-click ---------------- */
  board.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.target !== board && e.target !== world && !emptyEl.contains(e.target)) return;
    panPtr = { sx:e.clientX, sy:e.clientY, px:state.pan.x, py:state.pan.y };
    board.classList.add('panning');
  });
  board.addEventListener('dblclick', e => {
    if (e.target !== board && e.target !== world && !emptyEl.contains(e.target)) return;
    const w = toWorld(e.clientX, e.clientY);
    const n = createNote(w.x - DEFAULT_W/2, w.y - 30);
    openEditor(n.id);
  });

  document.getElementById('newBtn').addEventListener('click', newNoteInView);
  document.getElementById('centerBtn').addEventListener('click', () => {
    const tops = Object.values(state.notes).filter(n => !n.parent);
    const r = board.getBoundingClientRect();
    if (!tops.length){ state.pan = { x:0, y:0 }; }
    else {
      const minX = Math.min(...tops.map(n => n.x)), maxX = Math.max(...tops.map(n => n.x + (n.w || DEFAULT_W)));
      const minY = Math.min(...tops.map(n => n.y)), maxY = Math.max(...tops.map(n => n.y + 160));
      state.pan = { x: Math.round(r.width/2 - (minX + maxX)/2), y: Math.round(r.height/2 - (minY + maxY)/2) };
    }
    applyPan(); save();
  });

  /* ---------------- Editor ---------------- */
  const modal = document.getElementById('modal');
  const sheet = document.getElementById('sheet');
  const edText = document.getElementById('edText');
  const edAtts = document.getElementById('edAtts');
  const edDrop = document.getElementById('edDrop');
  const edFile = document.getElementById('edFile');
  const edDelete = document.getElementById('edDelete');
  const edDetach = document.getElementById('edDetach');
  const edLabel = document.getElementById('edLabel');
  const edTucked = document.getElementById('edTucked');
  const edSwatches = document.getElementById('edSwatches');
  let editId = null;

  function openEditor(id){
    const n = N(id); if (!n) return;
    editId = id;
    edText.value = n.text;
    disarmDelete();
    paintEditor();
    modal.hidden = false;
    setTimeout(() => { edText.focus(); edText.setSelectionRange(edText.value.length, edText.value.length); }, 0);
  }
  function closeEditor(){
    if (editId == null) return;
    editId = null;
    modal.hidden = true;
    render(); save();
  }
  function paintEditor(){
    const n = N(editId); if (!n) return;
    sheet.style.setProperty('--c', n.color);
    const lvl = levelOf(n);
    const parts = [];
    if (n.parent){ const pt = splitText(N(n.parent).text).title || 'Untitled'; parts.push(`Level ${lvl} of ${MAX_DEPTH} · inside “${pt.length > 24 ? pt.slice(0, 24) + '…' : pt}”`); }
    if (n.children.length) parts.push(`${n.children.length}/${MAX_TUCK} subnotes`);
    edLabel.textContent = parts.join(' · ');
    edDetach.hidden = !n.parent;

    edSwatches.textContent = '';
    COLORS.forEach(c => {
      const b = el('button', 'sw' + (c === n.color ? ' on' : ''));
      b.style.background = c; b.title = 'Note color'; b.setAttribute('aria-label', 'Color ' + c);
      b.addEventListener('click', () => { n.color = c; paintEditor(); render(); save(); });
      edSwatches.appendChild(b);
    });

    edAtts.textContent = '';
    n.attachments.forEach(a => {
      const box = el('div', 'att');
      if (isImg(a)){
        const img = el('img'); img.src = urlFor(a); img.alt = a.name;
        img.addEventListener('click', () => openLightbox(urlFor(a)));
        box.appendChild(img);
      } else box.appendChild(el('div', 'ic', ext(a.name)));
      const meta = el('div', 'meta');
      meta.appendChild(el('div', 'nm', a.name));
      const sz = el('div', 'sz', fmtSize(a.size || 0));
      if (!isImg(a)){ const l = el('a', '', 'Open'); l.href = urlFor(a); l.target = '_blank'; l.rel = 'noopener'; sz.appendChild(l); }
      meta.appendChild(sz);
      box.appendChild(meta);
      const rm = el('button', 'rm', '✕'); rm.title = 'Remove attachment';
      rm.addEventListener('click', () => {
        n.attachments = n.attachments.filter(x => x.id !== a.id);
        const u = urlCache.get(a.id); if (u){ URL.revokeObjectURL(u); urlCache.delete(a.id); }
        paintEditor(); render(); save();
      });
      box.appendChild(rm);
      edAtts.appendChild(box);
    });

    edTucked.textContent = '';
    if (n.children.length){
      edTucked.appendChild(el('div', 'lbl', 'Subnotes'));
      n.children.forEach(cid => {
        const c = N(cid); if (!c) return;
        const row = el('div', 'trow'); row.style.setProperty('--c', c.color);
        const { title } = splitText(c.text);
        const inner = c.children.length ? `  (+${c.children.length} inside)` : '';
        row.appendChild(el('span', 'tt' + (title ? '' : ' placeholder'), (title || 'Empty note') + inner));
        const open = el('button', 'btn', 'Open'); open.addEventListener('click', () => { render(); save(); openEditor(cid); });
        const out = el('button', 'btn', 'Pop out'); out.addEventListener('click', () => { detach(cid); paintEditor(); });
        row.append(open, out);
        edTucked.appendChild(row);
      });
    }
  }

  edText.addEventListener('input', () => { const n = N(editId); if (!n) return; n.text = edText.value; save(); });

  async function addFiles(list){
    const n = N(editId); if (!n || !list || !list.length) return;
    for (const f of list){
      n.attachments.push({ id:uid(), name:f.name || 'pasted-file', type:f.type || '', size:f.size || 0, blob:f });
    }
    paintEditor(); render(); save();
  }
  edFile.addEventListener('change', () => { addFiles([...edFile.files]); edFile.value = ''; });
  ['dragenter','dragover'].forEach(t => edDrop.addEventListener(t, e => { e.preventDefault(); edDrop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => edDrop.addEventListener(t, e => { e.preventDefault(); edDrop.classList.remove('over'); }));
  edDrop.addEventListener('drop', e => addFiles([...(e.dataTransfer?.files || [])]));
  sheet.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length){ e.preventDefault(); addFiles(files); }
  });
  // files dropped onto the sheet anywhere (not just the drop box)
  sheet.addEventListener('dragover', e => e.preventDefault());
  sheet.addEventListener('drop', e => { if (!edDrop.contains(e.target)){ e.preventDefault(); addFiles([...(e.dataTransfer?.files || [])]); } });
  // don't let a file dropped on the board navigate away
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  let armT = null;
  function disarmDelete(){ clearTimeout(armT); edDelete.classList.remove('armed'); edDelete.textContent = 'Delete note'; }
  edDelete.addEventListener('click', () => {
    if (!edDelete.classList.contains('armed')){
      edDelete.classList.add('armed'); edDelete.textContent = 'Click again to delete';
      armT = setTimeout(disarmDelete, 3000);
      return;
    }
    const id = editId; editId = null; modal.hidden = true; disarmDelete();
    deleteNote(id);
  });
  edDetach.addEventListener('click', () => { detach(editId); paintEditor(); });
  document.getElementById('edDone').addEventListener('click', closeEditor);
  document.getElementById('edClose').addEventListener('click', closeEditor);
  modal.addEventListener('pointerdown', e => { if (e.target === modal) closeEditor(); });

  /* ---------------- Lightbox ---------------- */
  const lb = document.getElementById('lightbox');
  function openLightbox(src){ lb.querySelector('img').src = src; lb.hidden = false; }
  lb.addEventListener('click', () => { lb.hidden = true; });

  /* ---------------- Keyboard ---------------- */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if (!lb.hidden){ lb.hidden = true; return; }
      if (!modal.hidden){ closeEditor(); return; }
    }
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
    if (!typing && modal.hidden && (e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey){
      e.preventDefault(); newNoteInView();
    }
  });

  /* ---------------- Load ---------------- */
  (async () => {
    try {
      const saved = await store.get('board');
      if (saved && saved.notes){
        state = saved;
        state.pan = state.pan || { x:0, y:0 };
        state.z = state.z || 1;
        for (const n of Object.values(state.notes)){
          n.attachments = (n.attachments || []).filter(a => a && a.blob);
          n.children = (n.children || []).filter(id => state.notes[id]);
        }
      }
      saveStateEl.textContent = 'Saved';
    } catch (e) {
      storageOk = false;
      saveStateEl.textContent = 'Not saved';
    }
    render();
  })();
})();
</script>
</body>
</html>
