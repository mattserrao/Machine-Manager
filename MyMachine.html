<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Machine</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="mm-theme.js?v=2026-11-08.1541"></script>
<link rel="stylesheet" href="mm-theme.css?v=2026-11-08.1541">
<script src="mm-icons.js?v=2026-11-08.1541"></script>
<style>
  /* shared look: mm-theme.css */
  .wrap{padding:14px 14px 60px;transition:margin-right .18s}
  body.drawer-open .wrap{margin-right:388px}
  #zoomPct{font-size:12px;min-width:44px;height:26px;text-align:center;font-variant-numeric:tabular-nums;border:0;background:transparent;border-radius:var(--r-sm);color:var(--ink-2)}
  #zoomPct:hover{background:var(--hover)}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line)}
  .card-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card-head h2{margin:0;font-size:13px;font-weight:600;color:var(--ink)}
  .md{font-size:12px;color:var(--muted);font-weight:500}
  .hint-ic{display:flex;color:var(--ink-3);cursor:help}
  .hint-ic:hover,.hint-ic:focus-visible{color:var(--ink)}
  .spacer{flex:1}
  .chip{background:rgb(var(--fg-rgb) / .06);color:var(--ink-2)}
  .chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .zoom{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:var(--r);padding:2px}
  .zoom .ib{min-width:26px;height:26px}

  #diagramScroll{overflow:auto;padding:8px 0 4px}
  #diagram{display:block;margin:0 auto}

  .tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:8px 12px 6px 16px}
  th.r,td.r{text-align:right}
  td{padding:8px 12px 8px 16px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--surface-2)}
  tbody tr.sel td{background:var(--accent-soft)}
  .pname{font-weight:500;display:flex;align-items:center;gap:8px}
  .pname .sw{width:9px;height:9px;border-radius:50%;background:var(--fc);flex:none}
  .psec{font-size:12px;color:var(--ink-2);margin-left:17px}
  .days{min-width:54px;justify-content:center;
    background:var(--hover)}
  .days.unset{color:var(--ink-3);font-weight:500}
  .days.soon{background:var(--warn-soft);color:var(--warn-ink)}
  .days.over{background:var(--bad);color:var(--on-primary)}
  .left{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
  .left.soon{color:var(--warn-ink);font-weight:600}
  .left.over{color:var(--bad-ink);font-weight:600}
  /* status shows as a thin bar on the row's left edge, not a row fill */
  tbody tr.soon td:first-child{box-shadow:inset 2px 0 0 var(--warn-line)}
  tbody tr.over td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
  .chip.soon{background:var(--warn-soft);color:var(--warn-ink)}
  .chip.over{background:var(--bad);color:var(--on-primary)}
  .legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .dt{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- Diagram (SVG) ---------- */
  .it{cursor:pointer}
  .it:focus{outline:none}
  .belt{fill:none;stroke:var(--fc);stroke-width:5;stroke-linejoin:round;transition:stroke-width .12s}
  .hit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;stroke-linejoin:round}
  .it:hover .belt,.it:focus-visible .belt{stroke-width:7.5}
  .it.sel .belt{stroke:var(--accent);stroke-width:7.5}
  .rl{fill:var(--raised);stroke:var(--c-roll);stroke-width:2.5;transition:fill .12s}
  .it.roll:hover .rl,.it.roll:focus-visible .rl{fill:var(--line-strong)}
  .it.sel .rl{stroke:var(--accent);stroke-width:4;fill:color-mix(in srgb,var(--accent) 20%,var(--raised))}
  .deco{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
  .it:hover .deco{stroke:var(--muted)}
  .core{fill:var(--surface);stroke:var(--faint);stroke-width:2;pointer-events:none}
  .rf{fill:var(--raised);stroke:var(--c-refiner);stroke-width:2.5;transition:fill .12s}
  .it.refiner:hover .rf,.it.refiner:focus-visible .rf{fill:var(--line-strong)}
  .it.sel .rf{stroke:var(--accent);stroke-width:3.5;fill:color-mix(in srgb,var(--accent) 20%,var(--raised))}
  .rf-tx{font-size:16px;font-weight:600;fill:var(--ink-2);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .pipe{fill:none;stroke:var(--line-strong);stroke-width:4;stroke-linejoin:round;pointer-events:none}
  .sec{cursor:pointer}
  .sec:focus{outline:none}
  .secbg{fill:transparent;pointer-events:all;transition:fill .12s}
  .sec:hover .secbg,.sec:focus-visible .secbg{fill:rgb(var(--fg-rgb) / .028)}
  .sec.sel .secbg{fill:rgba(106,160,255,.06)}
  .sec:hover .sec-tx{fill:var(--ink-2)}
  .sec.sel .sec-tx{fill:var(--accent)}
  .sec.sel .sec-ln{stroke:var(--accent-line)}
  .md{pointer-events:none}
  .cyl{fill:var(--raised);stroke:var(--faint);stroke-width:2;pointer-events:none}
  .hb{fill:var(--raised);stroke:var(--muted);stroke-width:2;stroke-linejoin:round;pointer-events:none}
  .sheet-ln{fill:none;stroke:var(--orange);stroke-width:2;stroke-linejoin:round;opacity:.55;pointer-events:none}
  .spool{fill:color-mix(in srgb,var(--orange) 22%,var(--raised));stroke:var(--orange);stroke-width:2;pointer-events:none}
  .bdg rect{fill:var(--surface);stroke:var(--fc);stroke-width:2}
  .bdg text{font-size:19px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
  .bdg.unset text{fill:var(--ink-3);font-weight:500}
  .halo{fill:none;stroke:transparent;stroke-width:18;stroke-linejoin:round;pointer-events:none}
  /* due soon / overdue: a faint ring around the part, and the day badge carries the colour */
  .it.soon .halo{stroke:var(--warn);stroke-opacity:.12}
  .it.over .halo{stroke:var(--bad);stroke-opacity:.22}
  .it.soon .bdg rect,.it.sel.soon .bdg rect{fill:color-mix(in srgb,var(--warn) 20%,var(--surface));stroke:var(--warn)}
  .it.soon .bdg text{fill:var(--warn-ink)}
  .it.over .bdg rect,.it.sel.over .bdg rect{fill:var(--bad);stroke:var(--bad)}
  .it.over .bdg text{fill:var(--on-primary)}
  .it.sel .bdg rect{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 18%,var(--surface))}
  .sec-ln{stroke:var(--line-strong);stroke-width:1.5;fill:none}
  .sec-tx{font-size:17px;font-weight:600;fill:var(--muted);text-anchor:middle}
  .md-arrow{fill:var(--faint)}
  .md-tx{font-size:18px;font-weight:500;fill:var(--ink-3)}

  /* ---------- Drawer ---------- */
  .drawer{position:fixed;top:calc(var(--top-full) + 10px);right:12px;bottom:12px;width:360px;z-index:100;display:flex;flex-direction:column;background:var(--overlay);
    border-radius:var(--r-lg);border:1px solid var(--line-strong);box-shadow:var(--shadow-pop);overflow:hidden}
  .d-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
  .due{border-radius:var(--r-lg);padding:10px 12px;font-size:13px;line-height:1.45;background:var(--hover);color:var(--ink-2)}
  .due b{font-weight:600}
  .due.soon{background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line)}
  .due.over{background:var(--bad-soft);color:var(--bad-ink);border:1px solid var(--bad-line)}
  .fld input[type=number]{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 9px;font-size:13px;outline:none;width:96px}
  .fld input[type=number]:focus{border-color:var(--faint)}
  .d-head .kind{font-size:12px;font-weight:600;color:var(--muted)}
  .d-head .where{font-size:12px;color:var(--muted)}
  .x{border:0;background:transparent;font-size:18px;line-height:1;padding:4px 6px;border-radius:var(--r-sm);color:var(--muted);margin-left:auto;display:grid;place-items:center}
  .x:hover{background:rgb(var(--fg-rgb) / .07)}
  .d-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
  .d-foot{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
  .d-body h3{margin:0;font-size:18px;font-weight:600;line-height:1.3}
  .big{display:flex;align-items:baseline;gap:8px}
  .big b{font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .big span{font-size:13px;color:var(--muted)}
  .big.unset b{font-size:22px;color:var(--ink-3);font-weight:500}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld > label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
  .fld input[type=text],.fld input[type=date],.fld select,.fld textarea{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 9px;font-size:13px;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent-line)}
  .fld textarea{min-height:80px;resize:vertical;line-height:1.45}
  .row{display:flex;gap:8px;align-items:center}
  .ck{display:flex;align-items:center;gap:8px;font-size:13px}
  .ck input{margin:0;accent-color:var(--ink)}
  .ck.dis{opacity:.45}
  .hint{font-size:12px;color:var(--muted);line-height:1.45}
  .hist{display:flex;flex-direction:column;gap:6px}
  .hrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 6px 6px 10px;font-size:13px}
  .hrow .tt{flex:1;color:var(--ink-2)}
  .hrow .rm{border:0;background:transparent;font-size:13px;color:var(--ink-3);padding:2px 6px;border-radius:var(--r-sm)}
  .hrow .rm:hover{color:var(--bad);background:var(--bad-soft)}
  .group{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px}
  .group h4{margin:0;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .group h4 .sw{width:9px;height:9px;border-radius:50%;background:var(--fc)}
  .dsec{display:flex;align-items:center;gap:8px}
  .dsec .n{font-size:12px;font-weight:600;color:var(--ink-2);width:62px}
  .dsec select{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 7px;font-size:13px}
  .slist{display:flex;flex-direction:column;gap:6px}
  .srow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px 7px 11px;text-align:left;font-size:13px}
  .srow:hover{background:var(--surface-2)}
  .srow.soon{background:var(--warn-soft);border-color:var(--warn-line)}
  .srow.over{background:var(--bad-soft);border-color:var(--bad-line)}
  .srow .sw{width:9px;height:9px;border-radius:50%;background:var(--fc);flex:none}
  .srow .nm{flex:1;min-width:0;font-weight:500;display:flex;flex-direction:column}
  .srow .nm small{font-size:12px;color:var(--muted);font-weight:400}
  .dsec input.rname{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;font-size:13px;outline:none}
  .dsec input.rname:focus{border-color:var(--faint)}
  /* ---------- Condition & history ---------- */
  :root{ --cd-wear:var(--attn); --cd-worn:var(--attn); --cd-damaged:var(--attn); }   /* one attention colour; the word says how bad */

  .cond.good{background:var(--hover);color:var(--ink-2)}
  .cond.wear,.cond.worn{background:transparent;color:var(--flag-ink);box-shadow:inset 0 0 0 1px var(--flag-line)}
  .cond.damaged{background:var(--bad);color:var(--on-primary)}
  .chip.flag{background:transparent;color:var(--flag-ink);box-shadow:inset 0 0 0 1px var(--flag-line)}
  .flg circle{stroke:var(--surface);stroke-width:2.5}
  .flg.wear circle{fill:var(--cd-wear)} .flg.worn circle{fill:var(--cd-worn)} .flg.damaged circle{fill:var(--cd-damaged)}
  .flg text{font-size:14px;font-weight:700;fill:var(--on-primary);text-anchor:middle;dominant-baseline:central}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;border-radius:var(--r-sm);padding:6px 4px;font-size:13px;font-weight:500;color:var(--ink-2)}
  .seg button:hover{background:var(--hover)}
  .seg button.on{background:var(--hover-2);color:var(--ink)}
  .seg button.on.wear,.seg button.on.worn,.seg button.on.damaged{background:var(--warn-soft);color:var(--warn-ink)}
  .flagbox{border-radius:var(--r-lg);padding:9px 12px;font-size:13px;line-height:1.45;background:transparent;color:var(--ink-2);border:1px solid var(--flag-line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid2 .fld input,.grid2 .fld select{width:100%;min-width:0}
  .grid2 .full{grid-column:1/-1}
  .chform{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px}
  .chform h4,.hedit h4{margin:0;font-size:13px;font-weight:600;color:var(--ink)}
  .hstats{display:flex;gap:6px;flex-wrap:wrap}
  .hcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 8px 8px 11px;font-size:13px;display:flex;flex-direction:column;gap:4px}
  .hcard .top{display:flex;align-items:center;gap:6px}
  .hcard .when{flex:1;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .hcard .age{background:var(--hover)}
  .hcard .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .hcard .what{color:var(--ink-2);font-size:12px}
  .hcard .nt{color:var(--ink-2);font-size:12px;line-height:1.45;white-space:pre-wrap}
  .hcard .rm,.hcard .ed{border:0;background:transparent;font-size:13px;color:var(--ink-3);padding:2px 6px;border-radius:var(--r-sm)}
  .hcard .ed:hover{color:var(--ink);background:var(--hover)}
  .hcard .rm:hover{color:var(--bad);background:var(--bad-soft)}
  .hedit{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px}
  .reason{background:var(--hover);color:var(--ink-2)}
  .reason.damaged{background:transparent;color:var(--flag-ink);box-shadow:inset 0 0 0 1px var(--flag-line)}
  .reason.performance{background:var(--hover);color:var(--ink-2)}
  .demo-box{border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

  .welcome{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:10px 12px;font-size:13px;line-height:1.5;color:var(--ink-2)}


  .tgt-m{display:none}
  .hit{stroke-width:var(--hit,20)}
  @media (max-width:820px){
    body.drawer-open .wrap{margin-right:0}
    .drawer{left:14px;width:auto}
    #summary{flex-wrap:wrap;min-width:0}
    .tables{grid-template-columns:minmax(0,1fr)} .tables > .card{min-width:0;overflow-x:auto}
    th{padding:8px 8px 6px 12px} td{padding:8px 8px 8px 12px}
  }
  /* ---------- Phones ---------- */
  @media (max-width:760px){
    .wrap{padding:10px 10px 8px}
    /* the summary chips carry the same colours, so the legend can go */
    .legend{display:none}
    .card-head{padding:10px 10px 10px 14px;row-gap:8px}
    #summary{order:5;flex-basis:100%}
    /* the diagram scrolls sideways at a readable size; a hint shows there's more */
    #diagramScroll{overscroll-behavior-x:contain;scrollbar-width:thin}
    /* tables: target life moves under the install date, so four columns fit */
    table th:nth-child(3),table td:nth-child(3){display:none}
    .tgt-m{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    th{padding:8px 6px 6px 12px} td{padding:9px 6px 9px 12px}
    th:last-child,td:last-child{padding-right:12px}
    .pname{gap:6px}
    .psec{margin-left:15px}
    /* side panel becomes a full-height sheet */
    .drawer{left:8px;right:8px;top:calc(var(--top-full) + 6px);bottom:calc(8px + env(safe-area-inset-bottom))}
    .grid2{grid-template-columns:1fr}
  }
  @media (pointer:coarse){
    .zoom .ib{min-width:38px;height:38px}
    #zoomPct{height:38px}
    .seg button{padding:10px 4px}
    .hrow .rm,.hcard .rm,.hcard .ed{padding:8px 10px}
  }
</style>
</head>
<body>
<header class="mm-top">
  <div class="bar brand">
    <button class="logo mmnav" type="button" aria-label="Switch app" aria-haspopup="menu" aria-expanded="false" title="Switch app"></button>
    <div><h1>My Machine</h1><p id="machName">—</p></div>
  </div>
  <div class="bar">
    <button id="setupBtn" class="btn" data-ic="settings" data-ic-size="sm">Setup</button>
    <button id="exportBtn" class="btn">Export</button>
    <button id="importBtn" class="btn">Import</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <span id="saveState"></span>
  </div>
  <div id="acct"></div>
</header>
<div class="wrap">

  <section class="card">
    <div class="card-head">
      <h2>Machine</h2>
      <span class="hint-ic" data-ic="help" data-ic-size="sm" tabindex="0" role="img" aria-label="Click a fabric, roll or refiner to set dates and target life; click a section name for its card" title="Click a fabric, roll or refiner to set dates and target life; click a section name for its card"></span>
      <span class="legend"><span><i style="background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-line)"></i>Due within 6 wks</span><span><i style="background:var(--bad)"></i>Overdue</span><span><i style="background:var(--cd-worn);border-radius:50%"></i>Flagged: change at next outage</span></span>
      <span class="spacer"></span>
      <span id="summary" class="row"></span>
      <div class="zoom">
        <button class="ib" id="zoomOut" title="Zoom out" aria-label="Zoom out" data-ic="minus" data-ic-size="sm"></button>
        <button id="zoomPct" title="Fit to width">Fit</button>
        <button class="ib" id="zoomIn" title="Zoom in" aria-label="Zoom in" data-ic="plus" data-ic-size="sm"></button>
      </div>
    </div>
    <div id="diagramScroll"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paper machine diagram"></svg></div>
  </section>

  <div class="tables">
    <section class="card">
      <div class="card-head"><h2>Fabrics</h2></div>
      <table><thead><tr><th>Position</th><th>Installed</th><th>Target</th><th class="r">Days on</th></tr></thead><tbody id="fabRows"></tbody></table>
    </section>
    <section class="card">
      <div class="card-head"><h2>Rolls</h2></div>
      <table><thead><tr><th>Position</th><th>Installed</th><th>Target</th><th class="r">Days on</th></tr></thead><tbody id="rollRows"></tbody></table>
    </section>
    <section class="card" id="refCard">
      <div class="card-head"><h2>Refiners</h2><span class="md">Plate life</span></div>
      <table><thead><tr><th>Refiner</th><th>Plates in</th><th>Target</th><th class="r">Days on</th></tr></thead><tbody id="refRows"></tbody></table>
    </section>
  </div>
  <div id="ver"></div>
</div>

<aside id="drawer" class="drawer" hidden></aside>
<div id="toast"></div>

<script src="vendor/supabase-2.119.0.js?v=2026-11-08.1541"></script>
<script src="mm-config.js?v=2026-11-08.1541"></script>
<script src="mm-cloud.js?v=2026-11-08.1541"></script>
<script src="mm-ui.js?v=2026-11-08.1541"></script>
<script src="mm-records.js?v=2026-11-08.1541"></script>
<script src="mm-machine.js?v=2026-11-08.1541"></script>
<script src="mm-demo.js?v=2026-11-08.1541"></script>
<script>
(() => {
  'use strict';
  const VERSION = 'v0.4.2';
  const KEY = 'machine-manager-mymachine';
  const $ = id => document.getElementById(id);
  $('ver').textContent = 'My Machine ' + VERSION;

  const MM = window.MMMachine;                 // shared machine model (mm-machine.js)
  const RID = MMRecords.mymachine;             // record ids (mm-records.js)
  const { DEFAULT_MACHINE, DEFAULT_REFINERS, DEFAULT_TARGET } = MM;
  const CAT_COLOR = { forming: 'var(--c-forming)', press: 'var(--c-press)', dryer: 'var(--c-dryer)', roll: 'var(--c-roll)', refiner: 'var(--c-refiner)' };
  const KIND_LABEL = { fabric: 'Fabric', roll: 'Roll', refiner: 'Refiner' };

  /* ---------- State & storage ---------- */
  let S = { machine: null, items: {} };
  let draft = null;           // machine config while Setup is open
  let selected = null;        // selected position id
  let selectedSec = null;     // selected section id
  let zoom = 'fit';
  let startedRight = false;
  const COARSE = matchMedia('(pointer:coarse)');

  // Signed out (demo): saved in this browser. Signed in: one Supabase record for the machine
  // setup plus one per tracked position ('item:<id>'), shared live with the organization.
  let cloud = null;           // MMCloud store when signed in, else null
  function readLocal(){
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.machine) return { machine: normalize(d.machine), items: MM.cleanItems(d.items), demo: !!d.demo };
    } catch (e) { /* storage unavailable or corrupt */ }
    return null;
  }
  function load(){ const l = readLocal(); if (l) S = l; }
  const toRecords = () => {
    const o = {};
    if (S.machine) o[RID.machine] = S.machine;
    for (const [id, it] of Object.entries(S.items)) o[RID.item(id)] = it;
    return o;
  };
  function fromRecords(d){
    const items = {};
    for (const [k, v] of Object.entries(d)){ const r = RID.parse(k); if (r && r.kind === 'item') items[r.pos] = v; }
    return { machine: d[RID.machine] ? normalize(d[RID.machine]) : null, items: MM.cleanItems(items) };
  }
  let saveTimer, warned = false, viewWarned = false;
  function cloudStatus(x, detail){
    const el = $('saveState');
    if (x === 'rejected') return toast('A change couldn’t be saved: ' + (detail || 'not allowed') + '.');
    if (x === 'saving') el.textContent = 'Saving…';
    else if (x === 'saved'){
      el.textContent = 'Saved'; warned = false;
      clearTimeout(saveTimer); saveTimer = setTimeout(() => el.textContent = '', 1600);
      if (cloud.conflicts) toast('Someone else changed that at the same moment — showing their version.');
    } else if (x === 'error'){
      el.textContent = 'Not saved';
      if (!warned){ warned = true; toast('Can’t reach the server — keep this page open, it will keep retrying.'); }
    } else if (x === 'viewonly'){
      el.textContent = 'View only';
      if (!viewWarned){ viewWarned = true; toast('You have view-only access — changes you make here aren’t saved.'); }
    }
  }
  let remoteFrame = 0;
  function onRemote(id, data){
    const r = RID.parse(id); if (!r) return;
    if (r.kind === 'machine'){
      S.machine = data ? normalize(data) : null;
      if (draft) toast('Someone else just changed the machine setup. Saving yours will replace it.');
    } else {
      const k = r.pos, it = data && MM.cleanItem(data);
      if (!/^[a-z0-9-]{1,60}$/.test(k)) return;
      if (it) S.items[k] = it; else delete S.items[k];
    }
    cancelAnimationFrame(remoteFrame);
    remoteFrame = requestAnimationFrame(() => {
      renderAll();
      // Refresh an open card for this position, unless someone is typing in it.
      if (!drawer.hidden && drawer.dataset.mode === 'item' && RID.item(drawer.dataset.id) === id && !drawer.contains(document.activeElement)) openItem(drawer.dataset.id);
    });
  }
  function save(ids){
    if (cloud) return cloud.save(ids);
    try {
      localStorage.setItem(KEY, JSON.stringify({ version: VERSION, saved: new Date().toISOString(), demo: !!S.demo, machine: S.machine, items: S.items }));
      $('saveState').textContent = 'Saved';
      clearTimeout(saveTimer); saveTimer = setTimeout(() => $('saveState').textContent = '', 1600);
    } catch (e) {
      $('saveState').textContent = 'Not saved';
      toast('Could not save in this browser. Use Export to keep a copy.');
    }
  }
  const { clone, esc } = MMUI;                 // mm-ui.js

  /* ---------- Dates ---------- */
  const { todayStr, parseDay, daysBetween, addDays, ord } = MM;
  const pad = n => String(n).padStart(2, '0');
  function daysOn(id){ const it = S.items[id]; return it && it.installed ? Math.max(0, daysBetween(it.installed, todayStr())) : null; }
  const WARN_DAYS = MM.WARN_DAYS;
  const targetOf = id => MM.targetOf(S.items[id], id);
  const lifeDays = id => MM.lifeDays(S.items[id], id);
  function status(id){
    const d = daysOn(id), L = lifeDays(id);
    if (d == null || L == null) return null;
    const left = L - d;
    return { left, due: addDays(S.items[id].installed, L), level: left < 0 ? 'over' : left <= WARN_DAYS ? 'soon' : 'ok' };
  }
  const fmtSpan = n => `${Math.abs(n)} d`;   // ages and time left in days, written like the days-on badges; weeks only for target life
  const fmtTarget = id => { const t = targetOf(id); return t ? `${t.target} ${t.unit === 'days' ? 'd' : 'wk'}` : '—'; };
  const fmtDate = s => MM.isDay(s) ? parseDay(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

  /* ---------- Positions & sections (derived from machine config, see mm-machine.js) ---------- */
  const { normalize, sections, positions } = MM;
  const twinFormer = m => m.former.type === 'twin';

  /* ---------- Diagram ---------- */
  // Laid out in flow order (stock prep first) from right to left: refiners and headbox on the right, reel on the left.
  const Y = 300, PAD = 20, GAP = 18, VB_TOP = 106, VB_BOT = 520;
  let W = 1000;
  const f1 = n => Math.round(n * 10) / 10;
  const pt = p => `${f1(p[0])} ${f1(p[1])}`;

  // Path of a belt (fabric or sheet) wrapping a sequence of circles {x,y,r,s}.
  // s = +1 wraps clockwise on screen, -1 counter-clockwise; r = 0 is a plain point.
  function wrapPath(cs, closed){
    const n = cs.length, pairs = closed ? n : n - 1, T = [];
    for (let i = 0; i < pairs; i++) {
      const a = cs[i], b = cs[(i + 1) % n];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
      const K = a.r * a.s - b.r * b.s;
      const ph = Math.atan2(dy, dx) + Math.asin(Math.max(-1, Math.min(1, K / L)));
      const mx = Math.sin(ph), my = -Math.cos(ph);
      T.push({ p1: [a.x + a.r * a.s * mx, a.y + a.r * a.s * my], p2: [b.x + b.r * b.s * mx, b.y + b.r * b.s * my] });
    }
    const arc = (c, from, to) => {
      if (!c.r) return '';
      const a1 = Math.atan2(from[1] - c.y, from[0] - c.x), a2 = Math.atan2(to[1] - c.y, to[0] - c.x);
      let dl = c.s > 0 ? a2 - a1 : a1 - a2;
      dl = ((dl % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      return ` A${c.r} ${c.r} 0 ${dl > Math.PI ? 1 : 0} ${c.s > 0 ? 1 : 0} ${pt(to)}`;
    };
    let d = `M${pt(T[0].p1)}`;
    if (closed) {
      for (let i = 0; i < n; i++) d += ` L${pt(T[i].p2)}` + arc(cs[(i + 1) % n], T[i].p2, T[(i + 1) % n].p1);
      return d + ' Z';
    }
    for (let i = 0; i < pairs; i++) { if (i > 0) d += arc(cs[i], T[i - 1].p2, T[i].p1); d += ` L${pt(T[i].p2)}`; }
    return d;
  }

  function buildDiagram(m){
    const P = positions(m), byId = Object.fromEntries(P.map(p => [p.id, p]));
    const tandem = m.press.tandem && m.press.nips > 1;
    const twin = twinFormer(m);
    const tpRef = m.refiners.filter(r => /^t/i.test(r.name.trim())), bpRef = m.refiners.filter(r => !/^t/i.test(r.name.trim()));
    const refCols = Math.max(tpRef.length, bpRef.length);
    const segs = [
      ...(m.refiners.length ? [{ t: 'refiners', w: refCols * 84 + 16, secs: [{ id: 'sec-refiners', label: 'Refiners' }] }] : []),
      { t: 'former', w: 370, secs: twin
          ? [{ id: 'sec-topply', label: 'Top ply wire', part: 'top' }, { id: 'sec-baseply', label: 'Base ply wire', part: 'bottom' }]
          : [{ id: 'sec-forming', label: 'Forming' }] },
      { t: 'press', w: m.press.nips * 130, secs: [{ id: 'sec-press', label: 'Press section' }] },
      ...m.dryers.map((d, i) => ({ t: 'dryer', w: 280, d, s: i + 1, secs: [{ id: `sec-dryer-${i + 1}`, label: `${ord(i + 1)} dryer${d.type === 'uno' ? ' · unorun' : ''}` }] })),
      ...(m.calender ? [{ t: 'calender', w: 90, secs: [{ id: 'sec-calender', label: 'Calender' }] }] : []),
      { t: 'reel', w: 90, secs: [{ id: 'sec-reel', label: 'Reel' }] }
    ];
    W = segs.reduce((a, s) => a + s.w, 0) + GAP * (segs.length - 1) + PAD * 2;
    let x = W - PAD;
    for (const s of segs) { s.x1 = x; s.x0 = x - s.w; s.cx = (s.x0 + s.x1) / 2; x = s.x0 - GAP; }

    const back = [], items = [], top = [], sheetPaths = [];
    let dryerSheet = null;   // circles the sheet wraps through the dryer sections
    let sheet = [];   // current straight run of the sheet, flowing right → left
    const flushSheet = () => { if (sheet.length > 1) sheetPaths.push(`M${sheet.map(pt).join(' L')}`); sheet = []; };

    const badge = (id, bx, by) => {
      const d = daysOn(id), txt = d == null ? '—' : `${d} d`;
      const w = Math.max(44, txt.length * 11.5 + 22);
      const it = S.items[id], fl = MM.flagged(it)
        ? `<g class="flg ${esc(it.condition)}"><title>${esc(MM.condLabel(it.condition))} — change at next outage</title><circle cx="${bx + w/2 - 1}" cy="${by - 14}" r="10"/><text x="${bx + w/2 - 1}" y="${by - 13.5}">!</text></g>` : '';
      return `<g class="bdg${d == null ? ' unset' : ''}"><rect x="${bx - w/2}" y="${by - 15}" width="${w}" height="30" rx="15"/><text x="${bx}" y="${by + 0.5}">${txt}</text></g>${fl}`;
    };
    const cls = id => { const st = status(id); return `it ${byId[id].kind}${selected === id ? ' sel' : ''}${st && st.level !== 'ok' ? ' ' + st.level : ''}`; };
    const open = (id) => `<g class="${esc(cls(id))}" data-id="${esc(id)}" tabindex="0" role="button" aria-label="${esc(byId[id].name)}" style="--fc:${CAT_COLOR[byId[id].cat]}"><title>${esc(byId[id].name)}</title>`;
    const deco = (c) => `<circle class="deco" cx="${c.x}" cy="${c.y}" r="${c.r}"/>`;
    // fabric as a belt (rounded rectangle) with optional corner rolls
    const belt = (id, x0, y0, x1, y1, corners, bx, by) => {
      const r = 24, cr = 9;
      let s = open(id) + `<rect class="halo" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${r}"/>` + `<rect class="hit" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${r}"/>`;
      s += `<rect class="belt" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${r}"/>`;
      const pts = { tl: [x0 + r, y0 + r], tr: [x1 - r, y0 + r], bl: [x0 + r, y1 - r], br: [x1 - r, y1 - r] };
      for (const c of corners) s += deco({ x: pts[c][0], y: pts[c][1], r: cr });
      return s + badge(id, bx, by) + '</g>';
    };
    // fabric that wraps a list of circles; small felt rolls (r < 12) are drawn as part of it
    const wrapBelt = (id, cs, bx, by) => {
      const d = wrapPath(cs, true);
      return open(id) + `<path class="halo" d="${d}"/><path class="hit" d="${d}"/><path class="belt" d="${d}"/>` +
        cs.filter(c => c.felt).map(deco).join('') + badge(id, bx, by) + '</g>';
    };
    const roll = (id, cx, cy, r, bx = cx, by = cy) =>
      open(id) + `<circle class="halo" cx="${cx}" cy="${cy}" r="${r + 6}" style="stroke-width:12"/><circle class="rl" cx="${cx}" cy="${cy}" r="${r}"/>` + badge(id, bx, by) + '</g>';
    const refiner = (id, name, rx, ry, by) =>
      open(id) + `<rect class="halo" x="${rx - 28}" y="${ry - 19}" width="56" height="38" rx="9"/>` +
        `<rect class="rf" x="${rx - 28}" y="${ry - 19}" width="56" height="38" rx="9"/><text class="rf-tx" x="${rx}" y="${ry + 1}">${esc(name)}</text>` +
        badge(id, rx, by) + '</g>';

    for (const s of segs) {
      const { x0, x1, cx } = s;
      if (s.t === 'refiners') {
        const rows = [[tpRef, 222, 184], [bpRef, 350, 388]];
        for (const [list, ry, by] of rows) {
          if (!list.length) continue;
          const xs = list.map((r, i) => x1 - 8 - 42 - i * 84);
          back.push(`<path class="pipe" d="M${xs[0]} ${ry} L${x0 - GAP - 6} ${ry} L${x0 - GAP - 6} ${ry < Y && twin ? 200 : 336} L${x0 - GAP - 70} ${ry < Y && twin ? 200 : 336}"/>`);
          list.forEach((r, i) => items.push(refiner(`ref-${r.id}`, r.name, xs[i], ry, by)));
        }
      } else if (s.t === 'former') {
        sheet.push([x1 - 70, Y]);
        items.push(belt('form-bottom', x0 + 4, Y + 4, x1 - 70, 410, ['tl', 'tr', 'bl', 'br'], (x0 + 4 + x1 - 70) / 2, 410));
        if (twin) items.push(belt('form-top', x0 + 105, 186, x1 - 70, Y - 4, ['tl', 'tr', 'bl', 'br'], (x0 + 105 + x1 - 70) / 2, 186));
        if (m.former.lumpbreaker) items.push(roll('lumpbreaker', x0 + 40, Y - 4 - 20, 20, x0 + 40, 230));
        sheet.push([x0, Y]);
      } else if (s.t === 'press') {
        for (let i = 0; i < m.press.nips; i++) {
          const n = i + 1, nx = x1 - 65 - i * 130;
          items.push(belt(`p${n}-felt-top`, nx - 55, 170, nx + 55, Y - 4, ['tl', 'tr'], nx, 170));
          if (!tandem) items.push(belt(`p${n}-felt-bottom`, nx - 55, Y + 4, nx + 55, 430, ['bl', 'br'], nx, 430));
        }
        if (tandem) items.push(belt('p-tandem-felt', x0 + 10, Y + 4, x1 - 10, 430, ['bl', 'br'], cx, 430));
        for (let i = 0; i < m.press.nips; i++) {
          const n = i + 1, nx = x1 - 65 - i * 130;
          top.push(roll(`p${n}-roll-top`, nx, Y - 4 - 30, 30));
          top.push(roll(`p${n}-roll-bottom`, nx, Y + 4 + 30, 30));
        }
        sheet.push([x0, Y]);
      } else if (s.t === 'dryer') {
        // Traced from the operator's sketch:
        //  - Sheet runs over the top cans and under the bottom cans (vacuum rolls in the unorun), and dips under a
        //    transfer roll between sections.
        //  - Top felt runs over the top cans and dips around felt rolls in the pockets between them; bottom felt runs
        //    under the bottom cans with a felt roll in the pocket above. Lead rolls at each end, return run outside.
        //  - Unorun: one felt over the top cans and under the vacuum rolls (sheet outside the felt on the vacuum rolls).
        const CR = 26, TY = 236, BY = 336, VR = 16, VY = 318;
        const tops = [x1 - 56, x1 - 140, x1 - 224], bots = [x1 - 98, x1 - 182];
        const uno = s.d.type === 'uno', last = s.s === m.dryers.length;
        tops.forEach(tx => back.push(`<circle class="cyl" cx="${tx}" cy="${TY}" r="${CR}"/>`));
        bots.forEach(bx => back.push(uno ? `<circle class="cyl" cx="${bx}" cy="${VY}" r="${VR}"/>` : `<circle class="cyl" cx="${bx}" cy="${BY}" r="${CR}"/>`));
        // sheet: one continuous wrap path through all dryer sections
        if (s.s === 1) { sheet.push([x1, Y]); flushSheet(); dryerSheet = [{ x: x1, y: Y, r: 0, s: 1 }]; }
        tops.forEach((tx, i) => {
          dryerSheet.push({ x: tx, y: TY, r: CR + 1.5, s: -1 });
          if (bots[i] != null) dryerSheet.push(uno ? { x: bots[i], y: VY, r: VR + 6, s: 1 } : { x: bots[i], y: BY, r: CR + 1.5, s: 1 });
        });
        const trX = x0 - GAP / 2, trY = 290, trR = 8;
        back.push(`<circle class="cyl" cx="${trX}" cy="${trY}" r="${trR}"/>`);
        dryerSheet.push({ x: trX, y: trY, r: trR + 1.5, s: 1 });
        if (last) {
          dryerSheet.push({ x: x0 - GAP, y: Y, r: 0, s: 1 });
          sheetPaths.push(wrapPath(dryerSheet, false));
          dryerSheet = null;
          sheet.push([x0 - GAP, Y]);
        }
        // felts
        const FR = CR + 5, fr = (x, y, r, s) => ({ x, y, r, s, felt: true });
        if (uno) {
          const cs = [fr(tops[0] + 54, 192, 8, 1)];
          tops.forEach((tx, i) => {
            cs.push({ x: tx, y: TY, r: FR, s: -1 });
            if (bots[i] != null) cs.push({ x: bots[i], y: VY, r: VR + 2.5, s: 1 });
          });
          cs.push(fr(tops[2] - 32, 192, 8, 1), fr(tops[2] - 32, 150, 8, 1), fr(tops[0] + 54, 150, 8, 1));
          items.push(wrapBelt(`d${s.s}-felt`, cs, cx, 142));
        } else {
          const ct = [fr(tops[0] + 28, 204, 8, 1)];
          tops.forEach((tx, i) => {
            ct.push({ x: tx, y: TY, r: FR, s: -1 });
            if (tops[i + 1] != null) ct.push(fr((tx + tops[i + 1]) / 2, 230, 7, 1));
          });
          ct.push(fr(tops[2] - 28, 204, 8, 1), fr(tops[2] - 28, 150, 8, 1), fr(tops[0] + 28, 150, 8, 1));
          items.push(wrapBelt(`d${s.s}-felt-top`, ct, cx, 142));
          const cb = [fr(bots[0] + 48, 340, 8, -1)];
          bots.forEach((bx, i) => {
            cb.push({ x: bx, y: BY, r: FR, s: 1 });
            if (bots[i + 1] != null) cb.push(fr((bx + bots[i + 1]) / 2, 342, 7, -1));
          });
          cb.push(fr(bots[1] - 48, 340, 8, -1), fr(bots[1] - 48, 430, 8, -1), fr(bots[0] + 48, 430, 8, -1));
          items.push(wrapBelt(`d${s.s}-felt-bottom`, cb, cx, 438));
        }
      } else if (s.t === 'calender') {
        top.push(roll('cal-top', cx, Y - 30, 30));
        top.push(roll('cal-bottom', cx, Y + 30, 30));
        sheet.push([x0, Y]);
      } else if (s.t === 'reel') {
        back.push(`<circle class="cyl" cx="${cx}" cy="330" r="26"/>`);
        back.push(`<circle class="spool" cx="${cx}" cy="264" r="40"/><circle class="core" cx="${cx}" cy="264" r="9"/>`);
        sheet.push([x1, Y]); flushSheet();
        const sr = 41.5, k = Math.SQRT1_2;
        sheetPaths.push(wrapPath([{ x: x1, y: Y, r: 0, s: 1 }, { x: cx, y: 264, r: sr, s: -1 }], false) + ` A${sr} ${sr} 0 0 0 ${pt([cx - sr * k, 264 - sr * k])}`);
      }
    }
    flushSheet();

    // clickable sections (background hit areas + brackets/labels)
    const secName = Object.fromEntries(sections(m).map(q => [q.id, q.name]));
    const secs = segs.map(s => {
      if (s.plain) return `<path class="sec-ln" d="M${s.x0} 480 L${s.x0} 486 L${s.x1} 486 L${s.x1} 480"/><text class="sec-tx plain" x="${s.cx}" y="510">${esc(s.plain)}</text>`;
      return s.secs.map(q => {
        const isTop = q.part === 'top';
        const y0 = isTop ? VB_TOP : q.part === 'bottom' ? 288 : VB_TOP, y1 = isTop ? 288 : VB_BOT;
        const lx0 = isTop ? s.x0 + 105 : s.x0, lx1 = isTop ? s.x1 - 2 : s.x1, lcx = (lx0 + lx1) / 2;
        const lbl = isTop
          ? `<path class="sec-ln" d="M${lx0} 160 L${lx0} 154 L${lx1} 154 L${lx1} 160"/><text class="sec-tx" x="${lcx}" y="140">${esc(q.label)}</text>`
          : `<path class="sec-ln" d="M${lx0} 480 L${lx0} 486 L${lx1} 486 L${lx1} 480"/><text class="sec-tx" x="${lcx}" y="510">${esc(q.label)}</text>`;
        return `<g class="sec${selectedSec === q.id ? ' sel' : ''}" data-sec="${q.id}" tabindex="0" role="button" aria-label="${esc(secName[q.id])}"><title>${esc(secName[q.id])}</title>` +
          `<rect class="secbg" x="${s.x0 - GAP / 2}" y="${y0}" width="${s.w + GAP}" height="${y1 - y0}" rx="10"/>${lbl}</g>`;
      }).join('');
    }).join('');
    // machine direction arrow (top-left, pointing left)
    const md = `<g class="md"><path class="md-arrow" d="M${PAD} 124 l16 -9 v6 h56 v6 h-56 v6 z"/><text class="md-tx" x="${PAD + 82}" y="125" dominant-baseline="central">Machine direction</text></g>`;
    const sheetSvg = sheetPaths.map(d => `<path class="sheet-ln" d="${d}"/>`).join('');

    return `<g>${secs}</g>${md}<g>${back.join('')}</g>${sheetSvg}<g>${items.join('')}</g><g>${top.join('')}</g>`;
  }

  function renderDiagram(m){
    const svg = $('diagram');
    svg.innerHTML = buildDiagram(m);
    svg.setAttribute('viewBox', `0 ${VB_TOP} ${W} ${VB_BOT - VB_TOP}`);
    applyZoom();
  }
  // Fit to the page width without the side panel, so opening a part doesn't shrink the diagram (it scrolls instead).
  function fitScale(){
    const sc = $('diagramScroll'), open = document.body.classList.contains('drawer-open') && innerWidth > 820;
    const avail = sc.clientWidth - 8 + (open ? 388 : 0);
    // On a phone the whole machine at screen width is too small to read or tap: keep it readable and let it scroll.
    const floor = innerWidth <= 760 ? 0.55 : 0.3;
    return Math.max(floor, Math.min(1.25, avail / W));
  }
  function applyZoom(){
    const sc = zoom === 'fit' ? fitScale() : zoom;
    const svg = $('diagram');
    svg.setAttribute('width', Math.round(W * sc));
    svg.setAttribute('height', Math.round((VB_BOT - VB_TOP) * sc));
    $('zoomPct').textContent = zoom === 'fit' ? 'Fit' : Math.round(sc * 100) + '%';
    // fabric runs are thin lines: on touch screens give them a hit area about 30px wide whatever the zoom
    svg.style.setProperty('--hit', COARSE.matches ? Math.max(20, Math.round(30 / sc)) : 20);
    // first time it overflows, start at the wet end (the headbox is on the right)
    const box = $('diagramScroll');
    if (!startedRight && box.scrollWidth > box.clientWidth + 4){ startedRight = true; box.scrollLeft = box.scrollWidth; }
  }
  function stepZoom(dir){
    const cur = zoom === 'fit' ? fitScale() : zoom;
    zoom = Math.min(2, Math.max(0.3, Math.round((cur + dir * 0.15) * 100) / 100));
    applyZoom();
  }

  /* ---------- Tables & summary ---------- */
  function renderTables(m){
    const P = positions(m);
    const row = p => {
      const it = S.items[p.id] || {}, d = daysOn(p.id), st = status(p.id), lv = st ? st.level : '';
      const left = st ? `<div class="left ${lv}">${st.left < 0 ? fmtSpan(st.left) + ' overdue' : st.left === 0 ? 'due today' : fmtSpan(st.left) + ' left'}</div>` : '';
      return `<tr data-id="${esc(p.id)}" class="${selected === p.id ? 'sel ' : ''}${lv}">
        <td><div class="pname" style="--fc:${CAT_COLOR[p.cat]}"><span class="sw"></span>${esc(p.name)}</div><div class="psec">${esc(p.section)}${MM.flagged(it) ? ` · <span class="cond ${esc(it.condition)}" title="Change at next outage">${esc(MM.condLabel(it.condition))}</span>` : ''}</div></td>
        <td class="dt">${esc(fmtDate(it.installed))}<span class="tgt-m">${fmtTarget(p.id) === '—' ? 'No target' : 'Target ' + fmtTarget(p.id)}</span></td>
        <td class="dt">${fmtTarget(p.id)}</td>
        <td class="r"><span class="days${d == null ? ' unset' : ''} ${lv}">${d == null ? 'not set' : d + ' d'}</span>${left}</td></tr>`;
    };
    $('fabRows').innerHTML = P.filter(p => p.kind === 'fabric').map(row).join('');
    $('rollRows').innerHTML = P.filter(p => p.kind === 'roll').map(row).join('');
    const refs = P.filter(p => p.kind === 'refiner');
    $('refCard').hidden = !refs.length;
    $('refRows').innerHTML = refs.map(row).join('');
    const fab = P.filter(p => p.kind === 'fabric').length, rl = P.filter(p => p.kind === 'roll').length, rf = P.length - fab - rl;
    const unset = P.filter(p => daysOn(p.id) == null).length;
    const over = P.filter(p => (status(p.id) || {}).level === 'over').length;
    const soon = P.filter(p => (status(p.id) || {}).level === 'soon').length;
    const flg = P.filter(p => MM.flagged(S.items[p.id])).length;
    $('summary').innerHTML = `<span class="chip">${fab} fabrics</span><span class="chip">${rl} rolls</span>` + (rf ? `<span class="chip">${rf} refiners</span>` : '') +
      (flg ? `<span class="chip flag">${flg} flagged</span>` : '') +
      (over ? `<span class="chip over">${over} overdue</span>` : '') +
      (soon ? `<span class="chip soon">${soon} due within 6 wks</span>` : '') +
      (unset ? `<span class="chip warn">${unset} not set</span>` : '');
    $('machName').textContent = m.name ? `${m.name} · fabric & roll ages` : 'Fabric & roll ages';
  }

  function renderAll(){
    const m = draft || S.machine || normalize(clone(DEFAULT_MACHINE));
    renderDiagram(m);
    renderTables(m);
  }

  /* ---------- Drawer: item editor ---------- */
  const drawer = $('drawer');
  function openDrawer(html){
    drawer.innerHTML = html; drawer.hidden = false;
    document.body.classList.add('drawer-open');
    requestAnimationFrame(applyZoom);
  }
  function closeDrawer(){
    drawer.hidden = true; drawer.innerHTML = '';
    document.body.classList.remove('drawer-open');
    if (draft) { draft = null; }
    selected = null; selectedSec = null;
    renderAll();
  }

  // Drawer sub-states for the open position (reset when another position opens).
  let chOpen = false;          // change-out form showing
  let histEdit = null;         // index into history being edited, or 'new' for a past run being added
  const optList = (list, sel) => list.map(x => `<option value="${x.id}"${x.id === sel ? ' selected' : ''}>${esc(x.label)}</option>`).join('');
  const what = h => [h.vendor, h.style, h.serial ? 'S/N ' + h.serial : ''].filter(Boolean).map(esc).join(' · ');

  function histForm(h, isRef){
    h = h || {};
    return `<div class="hedit"><h4>${histEdit === 'new' ? (isRef ? 'Add a past plate set' : 'Add a past run') : 'Edit run'}</h4>
      <div class="grid2">
        <div class="fld"><label for="hInst">Installed</label><input id="hInst" type="date" value="${esc(h.installed)}" max="${todayStr()}"></div>
        <div class="fld"><label for="hRem">Removed</label><input id="hRem" type="date" value="${esc(h.removed)}" max="${todayStr()}"></div>
        <div class="fld"><label for="hVendor">Vendor</label><input id="hVendor" type="text" value="${esc(h.vendor)}"></div>
        <div class="fld"><label for="hStyle">Style</label><input id="hStyle" type="text" value="${esc(h.style)}"></div>
        <div class="fld full"><label for="hSerial">Serial #</label><input id="hSerial" type="text" value="${esc(h.serial)}"></div>
        <div class="fld"><label for="hReason">Reason removed</label><select id="hReason">${optList(MM.REASONS, h.reason || 'planned')}</select></div>
        <div class="fld"><label for="hCond">Condition when removed</label><select id="hCond">${optList(MM.CONDITIONS, h.condition || 'good')}</select></div>
        <div class="fld full"><label for="hNote">Notes</label><textarea id="hNote" placeholder="What it looked like, why it came off, performance…">${esc(h.note)}</textarea></div>
      </div>
      <div class="row"><button class="btn" data-act="hcancel">Cancel</button><span class="spacer"></span><button class="btn primary" data-act="hsave">Save run</button></div>
    </div>`;
  }

  function openItem(id){
    if (draft) return; // Setup is open
    const p = positions(S.machine).find(q => q.id === id);
    if (!p) return;
    if (drawer.dataset.mode !== 'item' || drawer.dataset.id !== id) { chOpen = false; histEdit = null; }
    selected = id; selectedSec = null;
    renderAll();
    const it = S.items[id] || {}, tg = targetOf(id), isRef = p.kind === 'refiner';
    const d = daysOn(id);
    const histAll = it.history || [];
    const hist = histAll.slice().reverse();
    const st = status(id);
    const cond = it.condition || 'good', flag = MM.flagged(it);
    const dueBox = st
      ? `<div class="due ${st.level}">${st.level === 'over'
          ? `<b>Overdue by ${fmtSpan(st.left)}</b><br>Change was due ${fmtDate(st.due)}`
          : `<b>${st.left === 0 ? 'Due today' : fmtSpan(st.left) + ' left'}</b><br>Change due ${fmtDate(st.due)}`}</div>`
      : (tg ? `<div class="due">Set ${isRef ? 'the plate install date' : 'an install date'} to see when ${isRef ? 'plates are' : 'this is'} due.</div>` : '');
    const runWord = isRef ? 'plate set' : 'run';
    // history summary
    const ages = histAll.map(h => h.days).filter(n => n >= 0);
    const avg = ages.length ? Math.round(ages.reduce((a, b) => a + b, 0) / ages.length) : 0;
    const stats = ages.length > 1 ? `<div class="hstats"><span class="chip">${ages.length} ${runWord}s</span><span class="chip">avg ${avg} d</span><span class="chip">${Math.min(...ages)}–${Math.max(...ages)} d</span>${
      histAll.filter(h => h.reason === 'damaged').length ? `<span class="chip over">${histAll.filter(h => h.reason === 'damaged').length} damaged</span>` : ''}</div>` : '';
    const histCards = hist.map((h, i) => {
      const idx = hist.length - 1 - i;
      if (histEdit === idx) return histForm(h, isRef);
      const w = what(h);
      return `<div class="hcard">
        <div class="top"><span class="when">${fmtDate(h.installed)} → ${fmtDate(h.removed)}</span><span class="age">${esc(h.days)} d</span>
          <button class="ed" data-act="hedit" data-i="${idx}" title="Edit">${MMIcons.svg('pencil', 'sm')}</button><button class="rm" data-act="delhist" data-i="${idx}" title="Remove">${MMIcons.svg('x', 'sm')}</button></div>
        ${h.reason || h.condition ? `<div class="meta">${h.reason ? `<span class="reason ${esc(h.reason)}">${esc(MM.reasonLabel(h.reason))}</span>` : ''}${h.condition ? `<span class="cond ${esc(h.condition)}" title="Condition when removed">Condition: ${esc(MM.condLabel(h.condition))}</span>` : ''}</div>` : ''}
        ${w ? `<div class="what">${w}</div>` : ''}
        ${h.note ? `<div class="nt">${esc(h.note)}</div>` : ''}
      </div>`;
    }).join('');
    const changeForm = `<div class="chform"><h4>Log change-out</h4>
      <div class="grid2">
        <div class="fld full"><label for="chDate">${isRef ? 'Plates changed on' : 'Changed on'}</label><input id="chDate" type="date" value="${todayStr()}" min="${esc(it.installed)}" max="${todayStr()}"></div>
        <div class="fld"><label for="chReason">Reason removed</label><select id="chReason">${optList(MM.REASONS, MM.defaultReason(it))}</select></div>
        <div class="fld"><label for="chCond">Condition when removed</label><select id="chCond">${optList(MM.CONDITIONS, cond)}</select></div>
        <div class="fld full"><label for="chNote">Notes on the ${runWord} coming off</label><textarea id="chNote">${esc([it.note, it.conditionNote].filter(Boolean).join(' — '))}</textarea></div>
        <div class="fld full"><span class="lbl">New ${isRef ? 'plates' : p.kind}</span></div>
        <div class="fld"><label for="chVendor">Vendor</label><input id="chVendor" type="text" value="${esc(it.vendor)}"></div>
        <div class="fld"><label for="chStyle">Style</label><input id="chStyle" type="text" value="${esc(it.style)}"></div>
        <div class="fld full"><label for="chSerial">Serial #</label><input id="chSerial" type="text" placeholder="New serial number"></div>
      </div>
      <div class="row"><button class="btn" data-act="chcancel">Cancel</button><span class="spacer"></span><button class="btn primary" data-act="chsave">Log change</button></div>
      <span class="hint">The current ${runWord} (${d ?? 0} d) moves to history and the count restarts from the change date.</span>
    </div>`;
    openDrawer(`
      <div class="d-head" style="--fc:${CAT_COLOR[p.cat]}">
        <div><div class="kind">${KIND_LABEL[p.kind]}</div><div class="where">${esc(p.section)}</div></div>
        <button class="x" data-act="close" aria-label="Close">${MMIcons.svg('x')}</button>
      </div>
      <div class="d-body">
        <h3>${esc(p.name)}</h3>
        <div class="big${d == null ? ' unset' : ''}">${d == null ? `<b>No ${isRef ? 'plate ' : ''}install date</b>` : `<b>${d}</b><span>day${d === 1 ? '' : 's'} on ${isRef ? 'plates' : 'machine'}</span>`}</div>
        <div class="fld">
          <span class="lbl">Condition</span>
          <div class="seg" role="radiogroup" aria-label="Condition">${MM.CONDITIONS.map(c => `<button role="radio" aria-checked="${c.id === cond}" class="${c.id}${c.id === cond ? ' on' : ''}" data-act="cond" data-c="${c.id}">${c.label}</button>`).join('')}</div>
          ${flag ? `<div class="flagbox ${esc(cond)}"><b>Flagged — change at the next outage.</b>${it.conditionDate ? ` Marked ${fmtDate(it.conditionDate)}.` : ''}</div>
            <input id="condNote" type="text" value="${esc(it.conditionNote)}" placeholder="What’s wrong? (shows in Outage Planning)" style="border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;font-size:13px;outline:none">`
          : '<span class="hint">Wear, Worn or Damaged flags it to be changed at the next outage.</span>'}
        </div>
        <div class="fld">
          <label for="inst">${isRef ? 'Plates installed' : 'Installed'}</label>
          <div class="row">
            <input id="inst" type="date" value="${esc(it.installed)}" max="${todayStr()}">
            <button class="btn sm" data-act="today">Today</button>
            ${it.installed ? '<button class="btn sm" data-act="clear">Clear</button>' : ''}
          </div>
        </div>
        <div class="fld">
          <label for="tgt">${isRef ? 'Target plate life' : 'Target life'}</label>
          <div class="row">
            <input id="tgt" type="number" min="1" step="1" inputmode="numeric" value="${tg ? esc(tg.target) : ''}" placeholder="e.g. 26">
            <select id="tgtUnit"><option value="weeks"${!tg || tg.unit === 'weeks' ? ' selected' : ''}>weeks</option><option value="days"${tg && tg.unit === 'days' ? ' selected' : ''}>days</option></select>
          </div>
          <span class="hint">Turns yellow within 6 weeks of the target, red once it’s past.${tg && tg.dflt ? ' Default for refiner plates is 12 weeks.' : ''}</span>
        </div>
        ${dueBox}
        <div class="grid2">
          <div class="fld"><label for="curVendor">Vendor</label><input id="curVendor" type="text" value="${esc(it.vendor)}"></div>
          <div class="fld"><label for="curStyle">Style</label><input id="curStyle" type="text" value="${esc(it.style)}"></div>
          <div class="fld full"><label for="curSerial">Serial #</label><input id="curSerial" type="text" value="${esc(it.serial)}"></div>
        </div>
        <div class="fld">
          <label for="note">Notes</label>
          <textarea id="note" placeholder="Running notes on this ${runWord}…">${esc(it.note || '')}</textarea>
        </div>
        ${it.installed ? (chOpen ? changeForm : `<div class="fld">
          <span class="lbl">Changed out</span>
          <div class="row"><button class="btn danger" data-act="replace">${isRef ? 'Log plate change…' : 'Log change-out…'}</button></div>
          <span class="hint">Records why it came off and its condition, then starts a new ${runWord}.</span>
        </div>`) : ''}
        <div class="fld"><span class="lbl">${isRef ? 'Previous plate sets' : 'History'}</span>
          ${stats}
          ${hist.length || histEdit === 'new' ? `<div class="hist">${histEdit === 'new' ? histForm({}, isRef) : ''}${histCards}</div>` : `<span class="hint">No previous ${runWord}s logged yet.</span>`}
          ${histEdit === 'new' ? '' : `<div><button class="btn sm" data-act="hadd">${MMIcons.svg('plus', 'sm')}Add past ${runWord}</button></div>`}
        </div>
      </div>`);
    drawer.dataset.mode = 'item';
    drawer.dataset.id = id;
  }

  function openSection(secId){
    if (draft) return; // Setup is open
    const m = S.machine, sec = sections(m).find(q => q.id === secId);
    if (!sec) return;
    selected = null; selectedSec = secId;
    renderAll();
    const P = positions(m).filter(p => p.section === sec.name);
    const over = P.filter(p => (status(p.id) || {}).level === 'over').length;
    const soon = P.filter(p => (status(p.id) || {}).level === 'soon').length;
    const rows = P.map(p => {
      const d = daysOn(p.id), st = status(p.id), lv = st ? st.level : '';
      const left = st ? (st.left < 0 ? fmtSpan(st.left) + ' overdue' : st.left === 0 ? 'due today' : fmtSpan(st.left) + ' left') : '';
      return `<button class="srow ${lv}" data-act="item" data-id="${esc(p.id)}" style="--fc:${CAT_COLOR[p.cat]}">
        <span class="sw"></span><span class="nm">${esc(p.name)}<small>${KIND_LABEL[p.kind]}${left ? ' · ' + left : ''}${MM.flagged(S.items[p.id]) ? ' · <b>' + esc(MM.condLabel(S.items[p.id].condition)) + '</b>, change next outage' : ''}</small></span>
        <span class="days${d == null ? ' unset' : ''} ${lv}">${d == null ? 'not set' : d + ' d'}</span></button>`;
    }).join('');
    openDrawer(`
      <div class="d-head">
        <div><div class="kind" style="color:var(--ink)">Section</div><div class="where">${esc(m.name || '')}</div></div>
        <button class="x" data-act="close" aria-label="Close">${MMIcons.svg('x')}</button>
      </div>
      <div class="d-body">
        <h3>${esc(sec.name)}</h3>
        ${over || soon ? `<div class="row">${over ? `<span class="chip over">${over} overdue</span>` : ''}${soon ? `<span class="chip soon">${soon} due within 6 wks</span>` : ''}</div>` : ''}
        ${P.length ? `<div class="fld"><span class="lbl">Tracked here</span><div class="slist">${rows}</div></div>` : '<span class="hint">Nothing tracked in this section yet.</span>'}
        <span class="hint">More for this section is coming in a later version.</span>
      </div>`);
    drawer.dataset.mode = 'section';
    drawer.dataset.id = secId;
  }

  function setItem(id, patch){
    const it = S.items[id] = Object.assign({ installed: '', note: '', history: [] }, S.items[id] || {}, patch);
    if (!it.installed && !it.note && !(it.target > 0) && !(it.history || []).length && !it.vendor && !it.style && !it.serial && !MM.flagged(it)) delete S.items[id];
    save([RID.item(id)]);
  }

  let armTimer;
  drawer.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = drawer.dataset.id;
    if (act === 'close') return closeDrawer();
    if (drawer.dataset.mode === 'setup') return setupAction(act, b);
    if (act === 'item') return openItem(b.dataset.id);
    if (act === 'today') { setItem(id, { installed: todayStr() }); openItem(id); }
    else if (act === 'clear') { setItem(id, { installed: '' }); openItem(id); }
    else if (act === 'cond') {
      const c = b.dataset.c, it = S.items[id] || {};
      if ((it.condition || 'good') === c) return;
      setItem(id, { condition: c, conditionDate: c === 'good' ? '' : todayStr(), conditionNote: c === 'good' ? '' : (it.conditionNote || '') });
      if (c !== 'good') toast(`Flagged ${MM.condLabel(c).toLowerCase()} — it’ll show on the next outage`);
      openItem(id);
      if (c !== 'good') { const n = $('condNote'); if (n) n.focus(); }
    }
    else if (act === 'replace') { chOpen = true; histEdit = null; openItem(id); drawer.querySelector('.chform').scrollIntoView({ block: 'start' }); $('chReason').focus({ preventScroll: true }); }
    else if (act === 'chcancel') { chOpen = false; openItem(id); }
    else if (act === 'chsave') {
      const it = S.items[id], t = $('chDate').value || todayStr();
      if (t < it.installed) return toast('Change date can’t be before the install date');
      if (t > todayStr()) return toast('Change date can’t be in the future');
      const prev = clone(it);
      try {
        S.items[id] = MM.replaced(it, t, { reason: $('chReason').value, condition: $('chCond').value, note: $('chNote').value.trim(),
          vendor: $('chVendor').value.trim(), style: $('chStyle').value.trim(), serial: $('chSerial').value.trim() });
      } catch (e) { return toast(e.message); }
      save(); chOpen = false; renderAll(); openItem(id);
      toast(id.startsWith('ref-') ? 'Plate change logged' : 'Change-out logged', 'Undo', () => { S.items[id] = prev; save(); renderAll(); openItem(id); });
    }
    else if (act === 'hadd' || act === 'hedit') {
      histEdit = act === 'hadd' ? 'new' : +b.dataset.i; chOpen = false; openItem(id);
      drawer.querySelector('.hedit').scrollIntoView({ block: 'nearest' }); $('hInst').focus({ preventScroll: true });
    }
    else if (act === 'hcancel') { histEdit = null; openItem(id); }
    else if (act === 'hsave') {
      const inst = $('hInst').value, rem = $('hRem').value;
      if (!inst || !rem) return toast('Enter both the installed and removed dates');
      if (rem < inst) return toast('Removed date can’t be before installed');
      const it = S.items[id] || {};
      if (it.installed && rem > it.installed) return toast('A past run has to come off by the current install date');
      const h = { installed: inst, removed: rem, days: daysBetween(inst, rem), vendor: $('hVendor').value.trim(), style: $('hStyle').value.trim(),
        serial: $('hSerial').value.trim(), reason: $('hReason').value, condition: $('hCond').value, note: $('hNote').value.trim() };
      const history = (it.history || []).slice();
      if (histEdit === 'new') history.push(h); else history[histEdit] = h;
      history.sort((a, b) => a.installed.localeCompare(b.installed));
      histEdit = null;
      setItem(id, { history }); renderAll(); openItem(id);
    }
    else if (act === 'delhist') {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = 'Remove?'; b.style.color = 'var(--bad)';
        clearTimeout(armTimer); armTimer = setTimeout(() => { b.classList.remove('armed'); b.innerHTML = MMIcons.svg('x', 'sm'); b.style.color = ''; }, 3000);
        return;
      }
      const history = (S.items[id].history || []).slice(); history.splice(+b.dataset.i, 1);
      histEdit = null;
      setItem(id, { history }); openItem(id);
    }
  });
  drawer.addEventListener('change', e => {
    if (drawer.dataset.mode === 'setup') return setupChange(e);
    if (e.target.id === 'inst') {
      let v = e.target.value;
      if (v && v > todayStr()) { v = todayStr(); toast('Install date can’t be in the future'); }
      setItem(drawer.dataset.id, { installed: v }); openItem(drawer.dataset.id);
    } else if (e.target.id === 'tgt' || e.target.id === 'tgtUnit') {
      const n = Math.round(Number($('tgt').value));
      setItem(drawer.dataset.id, { target: n > 0 ? n : 0, targetUnit: $('tgtUnit').value });
      openItem(drawer.dataset.id);
    }
  });
  drawer.addEventListener('input', e => {
    if (drawer.dataset.mode === 'setup') return setupChange(e);
    const f = { note: 'note', curVendor: 'vendor', curStyle: 'style', curSerial: 'serial', condNote: 'conditionNote' }[e.target.id];
    if (f) setItem(drawer.dataset.id, { [f]: e.target.value });
  });

  /* ---------- Drawer: machine setup ---------- */
  let firstRun = false;
  function openSetup(first){
    firstRun = !!first;
    selected = null;
    draft = normalize(clone(S.machine || DEFAULT_MACHINE));
    drawer.dataset.mode = 'setup';
    drawSetup();
    renderAll();
  }
  function drawSetup(){
    const m = draft;
    const nipsOpt = [1, 2, 3].map(n => `<option value="${n}"${m.press.nips === n ? ' selected' : ''}>${n} nip${n > 1 ? 's' : ''}</option>`).join('');
    const dry = m.dryers.map((d, i) => `<div class="dsec"><span class="n">Section ${i + 1}</span>
      <select data-dry="${i}"><option value="uno"${d.type === 'uno' ? ' selected' : ''}>Unorun — single felt</option><option value="double"${d.type === 'double' ? ' selected' : ''}>Top &amp; bottom felts</option></select>
      <button class="ib" data-act="deldry" data-i="${i}" title="Remove section"${m.dryers.length < 2 ? ' disabled' : ''}>${MMIcons.svg('x', 'sm')}</button></div>`).join('');
    openDrawer(`
      <div class="d-head"><div><div class="kind" style="color:var(--ink)">Machine setup</div><div class="where">Headbox on the right, reel on the left</div></div>
        ${firstRun ? '' : `<button class="x" data-act="close" aria-label="Close">${MMIcons.svg('x')}</button>`}</div>
      <div class="d-body">
        ${firstRun ? '<div class="welcome"><b>Welcome.</b> Lay out your machine below; the diagram updates as you go. You can change this any time from <b>Setup</b>.</div>' : ''}
        <div class="fld"><label for="mName">Machine name</label><input id="mName" type="text" value="${esc(m.name)}" placeholder="PM1"></div>
        <div class="group" style="--fc:var(--c-refiner)"><h4><span class="sw"></span>Refiners</h4>
          ${m.refiners.map((r, i) => `<div class="dsec"><input type="text" class="rname" data-ref="${i}" value="${esc(r.name)}" placeholder="e.g. TP 1"><button class="ib" data-act="delref" data-i="${i}" title="Remove refiner">${MMIcons.svg('x', 'sm')}</button></div>`).join('')}
          <div><button class="btn sm" data-act="addref"${m.refiners.length >= 8 ? ' disabled' : ''}>${MMIcons.svg('plus', 'sm')}Add refiner</button></div>
          <span class="hint">Names starting with T are drawn in the top row (top ply), the rest below (base ply). Plate life target defaults to 12 weeks.</span>
        </div>
        <div class="group" style="--fc:var(--c-forming)"><h4><span class="sw"></span>Forming</h4>
          <div class="fld"><select id="fType">
            <option value="twin"${m.former.type === 'twin' ? ' selected' : ''}>Top ply &amp; base ply wires</option>
            <option value="fourdrinier"${m.former.type === 'fourdrinier' ? ' selected' : ''}>Single forming fabric</option></select></div>
          <label class="ck"><input id="fLump" type="checkbox"${m.former.lumpbreaker ? ' checked' : ''}> Lumpbreaker roll</label>
        </div>
        <div class="group" style="--fc:var(--c-press)"><h4><span class="sw"></span>Press</h4>
          <div class="fld"><select id="pNips">${nipsOpt}</select></div>
          <label class="ck${m.press.nips < 2 ? ' dis' : ''}"><input id="pTandem" type="checkbox"${m.press.tandem ? ' checked' : ''}${m.press.nips < 2 ? ' disabled' : ''}> Tandem bottom felt through all nips</label>
          <span class="hint">Each nip gets a top felt and a top &amp; bottom roll. Without tandem, each nip also gets its own bottom felt.</span>
        </div>
        <div class="group" style="--fc:var(--c-dryer)"><h4><span class="sw"></span>Dryers</h4>
          ${dry}
          <div><button class="btn sm" data-act="adddry"${m.dryers.length >= 8 ? ' disabled' : ''}>${MMIcons.svg('plus', 'sm')}Add section</button></div>
        </div>
        <div class="group" style="--fc:var(--c-roll)"><h4><span class="sw"></span>Calender &amp; reel</h4>
          <label class="ck"><input id="cal" type="checkbox"${m.calender ? ' checked' : ''}> Calender (top &amp; bottom roll)</label>
          <span class="hint">The reel is always shown.</span>
        </div>
        ${firstRun ? '' : '<span class="hint">Removing a position hides it but keeps its dates; add it back and they return.</span>'}
        ${!cloud && window.MMDemo ? `<div class="demo-box"><span class="lbl">Demo data (this browser only)</span>
          <div class="row"><button class="btn sm" data-act="demoload">Load demo data</button><button class="btn sm danger" data-act="democlear">Clear all dates &amp; history</button></div>
          <span class="hint">Demo data sets up PM1 with realistic ages, a few flagged items and a full base ply fabric history. Both can be undone.</span></div>` : ''}
      </div>
      <div class="d-foot">
        ${firstRun ? '' : '<button class="btn" data-act="close">Cancel</button>'}
        <span class="spacer"></span>
        <button class="btn primary" data-act="savesetup">${firstRun ? 'Create machine' : 'Save'}</button>
      </div>`);
    drawer.dataset.mode = 'setup';
  }
  function setupChange(e){
    const t = e.target, m = draft;
    if (t.id === 'mName') { m.name = t.value; renderTables(m); return; }
    if (t.dataset.ref != null) { m.refiners[+t.dataset.ref].name = t.value; renderAll(); return; }
    if (e.type === 'input') return;
    if (t.id === 'fType') m.former.type = t.value;
    else if (t.id === 'fLump') m.former.lumpbreaker = t.checked;
    else if (t.id === 'pNips') m.press.nips = +t.value;
    else if (t.id === 'pTandem') m.press.tandem = t.checked;
    else if (t.id === 'cal') m.calender = t.checked;
    else if (t.dataset.dry != null) m.dryers[+t.dataset.dry].type = t.value;
    drawSetup(); renderAll();
  }
  function setupAction(act, b){
    if (act === 'addref') { draft.refiners.push({ id: 'r' + Date.now().toString(36), name: '' }); drawSetup(); renderAll(); const ins = drawer.querySelectorAll('.rname'); if (ins.length) ins[ins.length - 1].focus(); return; }
    if (act === 'delref') { draft.refiners.splice(+b.dataset.i, 1); drawSetup(); renderAll(); return; }
    if (act === 'demoload' || act === 'democlear') {
      const prev = clone(S);
      S = act === 'demoload' ? MMDemo.build() : { machine: S.machine || draft, items: {}, demo: false };
      save(); firstRun = false; closeDrawer();
      toast(act === 'demoload' ? 'Demo data loaded' : 'All dates and history cleared', 'Undo', () => { S = prev; save(); renderAll(); });
      return;
    }
    if (act === 'adddry') { draft.dryers.push({ type: 'double' }); drawSetup(); renderAll(); }
    else if (act === 'deldry') { draft.dryers.splice(+b.dataset.i, 1); drawSetup(); renderAll(); }
    else if (act === 'savesetup') {
      draft.name = (draft.name || '').trim() || 'PM1';
      draft.refiners.forEach((r, i) => { r.name = (r.name || '').trim() || `Refiner ${i + 1}`; });
      S.machine = draft; save();
      const wasFirst = firstRun; firstRun = false;
      closeDrawer();
      toast(wasFirst ? 'Machine created. Click any fabric, roll or refiner to set its install date.' : 'Machine updated');
    }
  }

  /* ---------- Export / import ---------- */
  function exportJSON(){
    const P = positions(S.machine);
    const data = {
      app: 'machine-manager-mymachine', version: VERSION, exported: new Date().toISOString(),
      machine: S.machine, items: S.items,
      // flattened, human/LLM-readable view of current state (ignored on import)
      positions: P.map(p => ({ id: p.id, name: p.name, type: p.kind, section: p.section,
        installed: (S.items[p.id] || {}).installed || null, daysOn: daysOn(p.id), targetLifeDays: lifeDays(p.id),
        dueDate: (status(p.id) || {}).due || null, daysLeft: status(p.id) ? status(p.id).left : null,
        status: status(p.id) ? { ok: 'ok', soon: 'due within 6 weeks', over: 'overdue' }[status(p.id).level] : null,
        note: (S.items[p.id] || {}).note || '',
        vendor: (S.items[p.id] || {}).vendor || '', style: (S.items[p.id] || {}).style || '', serial: (S.items[p.id] || {}).serial || '',
        condition: (S.items[p.id] || {}).condition || 'good', flaggedForNextOutage: MM.flagged(S.items[p.id]),
        conditionNote: (S.items[p.id] || {}).conditionNote || '',
        history: ((S.items[p.id] || {}).history || []).map(h => Object.assign({}, h, { reason: MM.reasonLabel(h.reason) || h.reason || '', condition: MM.condLabel(h.condition) || '' })) }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `my-machine-${(S.machine.name || 'machine').replace(/[^\w-]+/g, '_')}-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importJSON(file){
    let d;
    try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
    if (!d || !d.machine || typeof d.machine !== 'object' || !d.machine.press || !Array.isArray(d.machine.dryers)) return toast('That file isn’t a My Machine export');
    const machine = normalize(d.machine), items = MM.cleanItems(d.items);
    const known = new Set(positions(machine).map(p => p.id));
    const raw = d.items && typeof d.items === 'object' ? Object.keys(d.items) : [];
    for (const k of Object.keys(items)) if (!known.has(k)) delete items[k];
    const skipped = raw.length - Object.keys(items).length;
    if (cloud && !confirm(`Importing replaces ${cloud.org ? cloud.org.name + '’s' : 'the shared'} My Machine for everyone in the organization` +
      ` (${Object.keys(items).length} positions${skipped ? `, ${skipped} skipped as unreadable or unknown` : ''}).\n\nImport anyway?`)) return;
    const prev = clone(S);
    S = { machine, items };
    if (draft) { draft = null; }
    drawer.hidden = true; document.body.classList.remove('drawer-open'); selected = null;
    save(); renderAll();
    toast(`Imported ${S.machine.name || 'machine'}${skipped ? ` · ${skipped} position${skipped === 1 ? '' : 's'} skipped` : ''}`, 'Undo', () => { S = prev; save(); renderAll(); });
  }

  /* ---------- Toast ---------- */
  function toast(msg, actLabel, fn){ MMUI.toast(msg, actLabel ? { label: actLabel, fn } : null); }   // mm-ui.js

  /* ---------- Events ---------- */
  $('diagram').addEventListener('click', e => {
    const g = e.target.closest('.it'), sg = e.target.closest('.sec');
    if (g) openItem(g.dataset.id);
    else if (sg) openSection(sg.dataset.sec);
    else if (!draft && !drawer.hidden) closeDrawer();
  });
  $('diagram').addEventListener('keydown', e => {
    const g = e.target.closest('.it'), sg = e.target.closest('.sec');
    if ((g || sg) && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g ? openItem(g.dataset.id) : openSection(sg.dataset.sec); }
  });
  ['fabRows', 'rollRows', 'refRows'].forEach(id => $(id).addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (tr) openItem(tr.dataset.id);
  }));
  $('setupBtn').onclick = () => openSetup(false);
  $('exportBtn').onclick = exportJSON;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };
  $('zoomIn').onclick = () => stepZoom(1);
  $('zoomOut').onclick = () => stepZoom(-1);
  $('zoomPct').onclick = () => { zoom = 'fit'; applyZoom(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !drawer.hidden && !firstRun) closeDrawer();
  });
  new ResizeObserver(() => { if (zoom === 'fit') applyZoom(); }).observe($('diagramScroll'));
  // Day counts roll over at midnight: refresh when the window comes back into view.
  let lastDay = todayStr();
  const refreshDay = () => { if (todayStr() !== lastDay) { lastDay = todayStr(); renderAll(); if (!drawer.hidden && drawer.dataset.mode === 'item') openItem(drawer.dataset.id); else if (!drawer.hidden && drawer.dataset.mode === 'section') openSection(drawer.dataset.id); } };
  window.addEventListener('focus', refreshDay);
  setInterval(refreshDay, 60000);

  /* ---------- Start ---------- */
  (async () => {
    if (window.MMCloud && MMCloud.enabled){
      MMCloud.mountAccount($('acct'), { compact: true });
      cloud = MMCloud.openStore('mymachine', { snapshot: toRecords, onChange: onRemote, onStatus: cloudStatus });
      let data = null;
      try { data = await cloud.ready; }
      catch (e) { toast('Can’t reach the server — showing this browser’s copy.'); }
      if (data){
        S = fromRecords(data);
        // First time signed in: offer to bring over a machine set up in demo mode.
        const local = readLocal(), askKey = `mm-mymachine-copy-asked:${cloud.org.id}`;
        let asked = false; try { asked = !!localStorage.getItem(askKey); } catch (e) {}
        if (!S.machine && local && !local.demo && cloud.edit && !asked){
          try { localStorage.setItem(askKey, '1'); } catch (e) {}
          const n = Object.values(local.items).filter(it => it.installed).length;
          if (confirm(`This browser has a machine saved from before you signed in (${local.machine.name}, ${n} install date${n === 1 ? '' : 's'}).\n\nCopy it to ${cloud.org.name} so your team can see it?`)){
            S = local; save(); toast(`Copied ${local.machine.name} to ${cloud.org.name}`);
          }
        }
        if (!S.machine && !cloud.edit) toast(`No machine has been set up for ${cloud.org.name} yet. Ask an editor to set it up.`);
      } else cloud = null;            // signed out or no organization: demo mode
    }
    if (!cloud) load();
    // Demo mode with nothing saved yet: start from the sample machine instead of a blank setup.
    let demoStart = false;
    if (!cloud && !S.machine && window.MMDemo) { S = MMDemo.build(); save(); demoStart = true; }
    if (demoStart) toast('Showing demo data for PM1. Setup can reload or clear it.');
    if (!S.machine && (!cloud || cloud.edit)) openSetup(true);
    else {
      renderAll();
      // Links from other tools (e.g. Outage Planning) open a position directly: MyMachine.html#item=<id>
      const m = /^#item=([\w-]+)$/.exec(location.hash);
      if (m && S.machine && positions(S.machine).some(p => p.id === m[1])) openItem(m[1]);
    }
  })();
})();
</script>
