<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
    --ok:#16a34a; --bad:#dc2626; --board:#fafaf9; --dot:#d6d3d1;
    --c-forming:#0891b2; --c-press:#d97706; --c-dryer:#9333ea; --c-roll:#44403c; --c-refiner:#475569;
    color-scheme:light only;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background-color:var(--board);
    background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px}
  button{font:inherit;color:inherit;cursor:pointer;background-color:#fff}
  textarea,input,select{background-color:#fff;color:var(--ink);font:inherit}
  [hidden]{display:none!important}

  .wrap{padding:14px 14px 60px;transition:margin-right .18s}
  body.drawer-open .wrap{margin-right:388px}

  /* ---------- Chrome (matches Whiteboard) ---------- */
  .bar{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{padding:6px 12px 6px 6px;gap:10px;text-decoration:none;color:inherit}
  .brand:hover{box-shadow:0 2px 14px rgba(0,0,0,.10)}
  .logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
  .brand h1{margin:0;font-size:15px;font-weight:600;line-height:1.2}
  .brand p{margin:0;font-size:11.5px;color:var(--muted)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
  .btn:hover{background:#f5f5f4}
  .btn:disabled{opacity:.4;cursor:default;background:#fff}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .btn.danger{color:var(--bad);border-color:#fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .ib{border:0;background:transparent;border-radius:7px;padding:5px 8px;font-size:14px;line-height:1;color:#44403c}
  .ib:hover{background:#f5f5f4}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  #saveState{font-size:11px;color:var(--muted);padding:0 6px;min-width:44px}
  #zoomPct{font-size:12px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;border:0;background:transparent;border-radius:6px;padding:4px}
  #zoomPct:hover{background:#f5f5f4}
  #ver{text-align:right;margin-top:18px;font-size:10.5px;color:rgba(0,0,0,.28);letter-spacing:.02em}

  /* ---------- Cards ---------- */
  .card{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.07);
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07)}
  .card-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card-head h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .md{font-size:12px;color:var(--muted);font-weight:500}
  .spacer{flex:1}
  .chip{font-size:11px;padding:2px 8px;background:rgba(0,0,0,.06);border-radius:999px;font-weight:500;color:#44403c;white-space:nowrap}
  .chip.warn{background:#fef3c7;color:#92400e}
  .zoom{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;padding:2px}

  #diagramScroll{overflow:auto;padding:8px 0 4px}
  #diagram{display:block;margin:0 auto}

  .tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 6px 16px}
  th.r,td.r{text-align:right}
  td{padding:8px 12px 8px 16px;border-top:1px solid #f1f1f0;vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#fafaf9}
  tbody tr.sel td{background:#eff6ff}
  .pname{font-weight:500;display:flex;align-items:center;gap:8px}
  .pname .sw{width:9px;height:9px;border-radius:50%;background:var(--fc);flex:none}
  .psec{font-size:11.5px;color:var(--muted);margin-left:17px}
  .days{display:inline-block;min-width:54px;text-align:center;font-weight:600;font-size:12px;padding:2px 9px;border-radius:999px;
    background:#f5f5f4;font-variant-numeric:tabular-nums}
  .days.unset{color:#a8a29e;font-weight:500}
  .days.soon{background:#fde047;color:#713f12}
  .days.over{background:#dc2626;color:#fff}
  .left{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
  .left.soon{color:#a16207;font-weight:600}
  .left.over{color:#b91c1c;font-weight:600}
  tbody tr.soon td{background:#fefce8}
  tbody tr.over td{background:#fef2f2}
  tbody tr.soon:hover td{background:#fef9c3}
  tbody tr.over:hover td{background:#fee2e2}
  tbody tr.sel td{box-shadow:inset 0 0 0 9999px rgba(37,99,235,.06)}
  .chip.soon{background:#fef08a;color:#713f12}
  .chip.over{background:#fee2e2;color:#b91c1c}
  .legend{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .dt{color:#57534e;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- Diagram (SVG) ---------- */
  .it{cursor:pointer}
  .it:focus{outline:none}
  .belt{fill:none;stroke:var(--fc);stroke-width:5;stroke-linejoin:round;transition:stroke-width .12s}
  .hit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;stroke-linejoin:round}
  .it:hover .belt,.it:focus-visible .belt{stroke-width:7.5}
  .it.sel .belt{stroke:var(--accent);stroke-width:7.5}
  .rl{fill:#e7e5e4;stroke:var(--c-roll);stroke-width:2.5;transition:fill .12s}
  .it.roll:hover .rl,.it.roll:focus-visible .rl{fill:#d6d3d1}
  .it.sel .rl{stroke:var(--accent);stroke-width:4;fill:#dbeafe}
  .deco{fill:#fff;stroke:#a8a29e;stroke-width:2}
  .it:hover .deco{stroke:#78716c}
  .core{fill:#fff;stroke:#a8a29e;stroke-width:2;pointer-events:none}
  .rf{fill:#f1f5f9;stroke:var(--c-refiner);stroke-width:2.5;transition:fill .12s}
  .it.refiner:hover .rf,.it.refiner:focus-visible .rf{fill:#e2e8f0}
  .it.sel .rf{stroke:var(--accent);stroke-width:3.5;fill:#dbeafe}
  .rf-tx{font-size:14px;font-weight:600;fill:#334155;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .pipe{fill:none;stroke:#d6d3d1;stroke-width:4;stroke-linejoin:round;pointer-events:none}
  .sec{cursor:pointer}
  .sec:focus{outline:none}
  .secbg{fill:transparent;pointer-events:all;transition:fill .12s}
  .sec:hover .secbg,.sec:focus-visible .secbg{fill:rgba(0,0,0,.028)}
  .sec.sel .secbg{fill:rgba(37,99,235,.06)}
  .sec:hover .sec-tx{fill:#44403c}
  .sec.sel .sec-tx{fill:var(--accent)}
  .sec.sel .sec-ln{stroke:#93c5fd}
  .md{pointer-events:none}
  .cyl{fill:#f5f5f4;stroke:#a8a29e;stroke-width:2;pointer-events:none}
  .hb{fill:#f5f5f4;stroke:#78716c;stroke-width:2;stroke-linejoin:round;pointer-events:none}
  .sheet-ln{fill:none;stroke:#b45309;stroke-width:2;stroke-linejoin:round;opacity:.8;pointer-events:none}
  .spool{fill:#f5e6c8;stroke:#a16207;stroke-width:2;pointer-events:none}
  .bdg rect{fill:#fff;stroke:var(--fc);stroke-width:2}
  .bdg text{font-size:19px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
  .bdg.unset text{fill:#a8a29e;font-weight:500}
  .halo{fill:none;stroke:transparent;stroke-width:18;stroke-linejoin:round;pointer-events:none}
  .it.soon .halo{stroke:rgba(250,204,21,.55)}
  .it.over .halo{stroke:rgba(239,68,68,.45)}
  .it.soon .bdg rect,.it.sel.soon .bdg rect{fill:#fde047;stroke:#ca8a04}
  .it.over .bdg rect,.it.sel.over .bdg rect{fill:#dc2626;stroke:#991b1b}
  .it.over .bdg text{fill:#fff}
  .it.sel .bdg rect{stroke:var(--accent);fill:#eff6ff}
  .sec-ln{stroke:#d6d3d1;stroke-width:1.5;fill:none}
  .sec-tx{font-size:15px;font-weight:600;fill:#78716c;text-anchor:middle;letter-spacing:.05em;text-transform:uppercase}
  .md-arrow{fill:#a8a29e}
  .md-tx{font-size:15px;font-weight:500;fill:#a8a29e}

  /* ---------- Drawer ---------- */
  .drawer{position:fixed;top:14px;right:14px;bottom:14px;width:360px;z-index:100;display:flex;flex-direction:column;background:#fff;
    border-radius:14px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.18);overflow:hidden}
  .d-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
  .due{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;background:#f5f5f4;color:#44403c}
  .due b{font-weight:600}
  .due.soon{background:#fef9c3;color:#713f12;border:1px solid #fde047}
  .due.over{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
  .fld input[type=number]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;outline:none;width:96px}
  .fld input[type=number]:focus{border-color:#a8a29e}
  .d-head .kind{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fc)}
  .d-head .where{font-size:12px;color:var(--muted)}
  .x{border:0;background:transparent;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px;color:rgba(0,0,0,.6);margin-left:auto}
  .x:hover{background:rgba(0,0,0,.07)}
  .d-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
  .d-foot{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
  .d-body h3{margin:0;font-size:18px;font-weight:600;line-height:1.3}
  .big{display:flex;align-items:baseline;gap:8px}
  .big b{font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .big span{font-size:13px;color:var(--muted)}
  .big.unset b{font-size:22px;color:#a8a29e;font-weight:500}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld > label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
  .fld input[type=text],.fld input[type=date],.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#a8a29e}
  .fld textarea{min-height:80px;resize:vertical;line-height:1.45}
  .row{display:flex;gap:8px;align-items:center}
  .ck{display:flex;align-items:center;gap:8px;font-size:13px}
  .ck input{margin:0;accent-color:var(--ink)}
  .ck.dis{opacity:.45}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.45}
  .hist{display:flex;flex-direction:column;gap:6px}
  .hrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;font-size:12.5px}
  .hrow .tt{flex:1;color:#44403c}
  .hrow .rm{border:0;background:transparent;font-size:13px;color:#a8a29e;padding:2px 6px;border-radius:5px}
  .hrow .rm:hover{color:var(--bad);background:#fef2f2}
  .group{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .group h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
  .group h4 .sw{width:9px;height:9px;border-radius:50%;background:var(--fc)}
  .dsec{display:flex;align-items:center;gap:8px}
  .dsec .n{font-size:12px;font-weight:600;color:#57534e;width:62px}
  .dsec select{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12.5px}
  .slist{display:flex;flex-direction:column;gap:6px}
  .srow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:7px 9px 7px 11px;text-align:left;font-size:13px}
  .srow:hover{background:#fafaf9}
  .srow.soon{background:#fefce8;border-color:#fde047}
  .srow.over{background:#fef2f2;border-color:#fca5a5}
  .srow .sw{width:9px;height:9px;border-radius:50%;background:var(--fc);flex:none}
  .srow .nm{flex:1;min-width:0;font-weight:500;display:flex;flex-direction:column}
  .srow .nm small{font-size:11.5px;color:var(--muted);font-weight:400}
  .dsec input.rname{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;outline:none}
  .dsec input.rname:focus{border-color:#a8a29e}
  .welcome{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:#1e3a8a}

  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:500;
    background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:9px;transition:.2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.act{pointer-events:auto}
  #toast button{margin-left:12px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:3px 9px;font-weight:600;font-size:12px}

  @media (max-width:820px){
    body.drawer-open .wrap{margin-right:0}
    .drawer{left:14px;width:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="bar brand" href="index.html" title="Back to tools">
      <div class="logo">MM</div>
      <div><h1>My Machine</h1><p id="machName">—</p></div>
    </a>
    <div class="bar">
      <button id="setupBtn" class="btn">⚙ Setup</button>
      <span class="sep"></span>
      <button id="exportBtn" class="btn">Export</button>
      <button id="importBtn" class="btn">Import</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
      <span id="saveState"></span>
    </div>
    <div id="acct"></div>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>Machine</h2>
      <span class="md">Click a fabric, roll or refiner to set dates and target life; click a section name for its card</span>
      <span class="legend"><span><i style="background:#fde047"></i>Due within 6 wks</span><span><i style="background:#dc2626"></i>Overdue</span></span>
      <span class="spacer"></span>
      <span id="summary" class="row"></span>
      <div class="zoom">
        <button class="ib" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoomPct" title="Fit to width">Fit</button>
        <button class="ib" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div id="diagramScroll"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paper machine diagram"></svg></div>
  </section>

  <div class="tables">
    <section class="card">
      <div class="card-head"><h2>Fabrics</h2></div>
      <table><thead><tr><th>Position</th><th>Installed</th><th>Target</th><th class="r">Days on</th></tr></thead><tbody id="fabRows"></tbody></table>
    </section>
    <section class="card">
      <div class="card-head"><h2>Rolls</h2></div>
      <table><thead><tr><th>Position</th><th>Installed</th><th>Target</th><th class="r">Days on</th></tr></thead><tbody id="rollRows"></tbody></table>
    </section>
    <section class="card" id="refCard">
      <div class="card-head"><h2>Refiners</h2><span class="md">Plate life</span></div>
      <table><thead><tr><th>Refiner</th><th>Plates in</th><th>Target</th><th class="r">Days on</th></tr></thead><tbody id="refRows"></tbody></table>
    </section>
  </div>
  <div id="ver"></div>
</div>

<aside id="drawer" class="drawer" hidden></aside>
<div id="toast"></div>

<script src="vendor/supabase-2.119.0.js"></script>
<script src="mm-config.js"></script>
<script src="mm-cloud.js"></script>
<script>
(() => {
  'use strict';
  const VERSION = 'v0.3.0';
  const KEY = 'machine-manager-mymachine';
  const $ = id => document.getElementById(id);
  $('ver').textContent = 'My Machine ' + VERSION;

  const DEFAULT_MACHINE = {
    name: 'PM1',
    former: { type: 'twin', lumpbreaker: true },
    press: { nips: 2, tandem: true },
    dryers: [{ type: 'uno' }, { type: 'double' }, { type: 'double' }],
    calender: true,
    refiners: null      // filled from DEFAULT_REFINERS
  };
  const DEFAULT_REFINERS = [{ id: 'bp1', name: 'BP 1' }, { id: 'bp2', name: 'BP 2' }, { id: 'tp1', name: 'TP 1' }, { id: 'tp2', name: 'TP 2' }];
  const DEFAULT_TARGET = { refiner: { target: 12, unit: 'weeks' } };   // plate life
  const CAT_COLOR = { forming: 'var(--c-forming)', press: 'var(--c-press)', dryer: 'var(--c-dryer)', roll: 'var(--c-roll)', refiner: 'var(--c-refiner)' };
  const KIND_LABEL = { fabric: 'Fabric', roll: 'Roll', refiner: 'Refiner' };

  /* ---------- State & storage ---------- */
  let S = { machine: null, items: {} };
  let draft = null;           // machine config while Setup is open
  let selected = null;        // selected position id
  let selectedSec = null;     // selected section id
  let zoom = 'fit';

  // Signed out (demo): saved in this browser. Signed in: one Supabase record for the machine
  // setup plus one per tracked position ('item:<id>'), shared live with the organization.
  let cloud = null;           // MMCloud store when signed in, else null
  function readLocal(){
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.machine) return { machine: normalize(d.machine), items: d.items || {} };
    } catch (e) { /* storage unavailable or corrupt */ }
    return null;
  }
  function load(){ const l = readLocal(); if (l) S = l; }
  const toRecords = () => {
    const o = {};
    if (S.machine) o.machine = S.machine;
    for (const [id, it] of Object.entries(S.items)) o['item:' + id] = it;
    return o;
  };
  function fromRecords(d){
    const items = {};
    for (const [k, v] of Object.entries(d)) if (k.startsWith('item:')) items[k.slice(5)] = v;
    return { machine: d.machine ? normalize(d.machine) : null, items };
  }
  let saveTimer, warned = false, viewWarned = false;
  function cloudStatus(x){
    const el = $('saveState');
    if (x === 'saving') el.textContent = 'Saving…';
    else if (x === 'saved'){
      el.textContent = 'Saved'; warned = false;
      clearTimeout(saveTimer); saveTimer = setTimeout(() => el.textContent = '', 1600);
      if (cloud.conflicts) toast('Someone else changed that at the same moment — showing their version.');
    } else if (x === 'error'){
      el.textContent = 'Not saved';
      if (!warned){ warned = true; toast('Can’t reach the server — keep this page open, it will keep retrying.'); }
    } else if (x === 'viewonly'){
      el.textContent = 'View only';
      if (!viewWarned){ viewWarned = true; toast('You have view-only access — changes you make here aren’t saved.'); }
    }
  }
  let remoteFrame = 0;
  function onRemote(id, data){
    if (id === 'machine'){
      S.machine = data ? normalize(data) : null;
      if (draft) toast('Someone else just changed the machine setup. Saving yours will replace it.');
    } else if (id.startsWith('item:')){
      const k = id.slice(5);
      if (data) S.items[k] = data; else delete S.items[k];
    }
    cancelAnimationFrame(remoteFrame);
    remoteFrame = requestAnimationFrame(() => {
      renderAll();
      // Refresh an open card for this position, unless someone is typing in it.
      if (!drawer.hidden && drawer.dataset.mode === 'item' && 'item:' + drawer.dataset.id === id && !drawer.contains(document.activeElement)) openItem(drawer.dataset.id);
    });
  }
  function save(){
    if (cloud) return cloud.save();
    try {
      localStorage.setItem(KEY, JSON.stringify({ version: VERSION, saved: new Date().toISOString(), machine: S.machine, items: S.items }));
      $('saveState').textContent = 'Saved';
      clearTimeout(saveTimer); saveTimer = setTimeout(() => $('saveState').textContent = '', 1600);
    } catch (e) {
      $('saveState').textContent = 'Not saved';
      toast('Could not save in this browser. Use Export to keep a copy.');
    }
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  /* ---------- Dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  function daysBetween(a, b){ return Math.round((parseDay(b) - parseDay(a)) / 864e5); }
  function daysOn(id){ const it = S.items[id]; return it && it.installed ? Math.max(0, daysBetween(it.installed, todayStr())) : null; }
  const WARN_DAYS = 42; // 6 weeks
  function addDays(s, n){ const d = parseDay(s); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function targetOf(id){
    const it = S.items[id];
    if (it && it.target > 0) return { target: it.target, unit: it.targetUnit === 'days' ? 'days' : 'weeks', dflt: false };
    const d = id.startsWith('ref-') ? DEFAULT_TARGET.refiner : null;
    return d ? { target: d.target, unit: d.unit, dflt: true } : null;
  }
  function lifeDays(id){ const t = targetOf(id); return t ? Math.round(t.target * (t.unit === 'days' ? 1 : 7)) : null; }
  function status(id){
    const d = daysOn(id), L = lifeDays(id);
    if (d == null || L == null) return null;
    const left = L - d;
    return { left, due: addDays(S.items[id].installed, L), level: left < 0 ? 'over' : left <= WARN_DAYS ? 'soon' : 'ok' };
  }
  const fmtSpan = n => { n = Math.abs(n); return n <= 60 ? `${n} day${n === 1 ? '' : 's'}` : `${Math.round(n / 7)} weeks`; };
  const fmtTarget = id => { const t = targetOf(id); return t ? `${t.target} ${t.unit === 'days' ? 'd' : 'wk'}` : '—'; };
  const fmtDate = s => s ? parseDay(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  const ord = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');

  /* ---------- Positions & sections (derived from machine config) ---------- */
  function normalize(m){
    if (!Array.isArray(m.refiners)) m.refiners = clone(DEFAULT_REFINERS);
    return m;
  }
  const twinFormer = m => m.former.type === 'twin';
  function sections(m){
    const S2 = [];
    if (m.refiners.length) S2.push({ id: 'sec-refiners', name: 'Refiners' });
    if (twinFormer(m)) S2.push({ id: 'sec-topply', name: 'Top ply wire' }, { id: 'sec-baseply', name: 'Base ply wire' });
    else S2.push({ id: 'sec-forming', name: 'Forming' });
    S2.push({ id: 'sec-press', name: 'Press section' });
    m.dryers.forEach((d, i) => S2.push({ id: `sec-dryer-${i + 1}`, name: `${ord(i + 1)} dryer section` }));
    if (m.calender) S2.push({ id: 'sec-calender', name: 'Calender' });
    S2.push({ id: 'sec-reel', name: 'Reel' });
    return S2;
  }
  function positions(m){
    const P = [];
    const add = (id, name, kind, cat, section) => P.push({ id, name, kind, cat, section });
    m.refiners.forEach(r => add(`ref-${r.id}`, `${r.name} refiner`, 'refiner', 'refiner', 'Refiners'));
    if (twinFormer(m)) {
      add('form-top', 'Top ply forming fabric', 'fabric', 'forming', 'Top ply wire');
      add('form-bottom', 'Base ply forming fabric', 'fabric', 'forming', 'Base ply wire');
    } else {
      add('form-bottom', 'Forming fabric', 'fabric', 'forming', 'Forming');
    }
    if (m.former.lumpbreaker) add('lumpbreaker', 'Lumpbreaker roll', 'roll', 'roll', twinFormer(m) ? 'Base ply wire' : 'Forming');
    const tandem = m.press.tandem && m.press.nips > 1;
    for (let n = 1; n <= m.press.nips; n++) {
      add(`p${n}-felt-top`, `${ord(n)} press top felt`, 'fabric', 'press', 'Press section');
      if (!tandem) add(`p${n}-felt-bottom`, `${ord(n)} press bottom felt`, 'fabric', 'press', 'Press section');
    }
    if (tandem) add('p-tandem-felt', 'Tandem felt', 'fabric', 'press', 'Press section');
    for (let n = 1; n <= m.press.nips; n++) {
      add(`p${n}-roll-top`, `${ord(n)} press top roll`, 'roll', 'roll', 'Press section');
      add(`p${n}-roll-bottom`, `${ord(n)} press bottom roll`, 'roll', 'roll', 'Press section');
    }
    m.dryers.forEach((d, i) => {
      const s = i + 1, sec = `${ord(s)} dryer section`;
      if (d.type === 'uno') add(`d${s}-felt`, `${ord(s)} section unorun felt`, 'fabric', 'dryer', sec);
      else {
        add(`d${s}-felt-top`, `${ord(s)} section top felt`, 'fabric', 'dryer', sec);
        add(`d${s}-felt-bottom`, `${ord(s)} section bottom felt`, 'fabric', 'dryer', sec);
      }
    });
    if (m.calender) {
      add('cal-top', 'Calender top roll', 'roll', 'roll', 'Calender');
      add('cal-bottom', 'Calender bottom roll', 'roll', 'roll', 'Calender');
    }
    return P;
  }

  /* ---------- Diagram ---------- */
  // Laid out in flow order (stock prep first) from right to left: refiners and headbox on the right, reel on the left.
  const Y = 300, PAD = 20, GAP = 18, VB_TOP = 106, VB_BOT = 520;
  let W = 1000;
  const f1 = n => Math.round(n * 10) / 10;
  const pt = p => `${f1(p[0])} ${f1(p[1])}`;

  // Path of a belt (fabric or sheet) wrapping a sequence of circles {x,y,r,s}.
  // s = +1 wraps clockwise on screen, -1 counter-clockwise; r = 0 is a plain point.
  function wrapPath(cs, closed){
    const n = cs.length, pairs = closed ? n : n - 1, T = [];
    for (let i = 0; i < pairs; i++) {
      const a = cs[i], b = cs[(i + 1) % n];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
      const K = a.r * a.s - b.r * b.s;
      const ph = Math.atan2(dy, dx) + Math.asin(Math.max(-1, Math.min(1, K / L)));
      const mx = Math.sin(ph), my = -Math.cos(ph);
      T.push({ p1: [a.x + a.r * a.s * mx, a.y + a.r * a.s * my], p2: [b.x + b.r * b.s * mx, b.y + b.r * b.s * my] });
    }
    const arc = (c, from, to) => {
      if (!c.r) return '';
      const a1 = Math.atan2(from[1] - c.y, from[0] - c.x), a2 = Math.atan2(to[1] - c.y, to[0] - c.x);
      let dl = c.s > 0 ? a2 - a1 : a1 - a2;
      dl = ((dl % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      return ` A${c.r} ${c.r} 0 ${dl > Math.PI ? 1 : 0} ${c.s > 0 ? 1 : 0} ${pt(to)}`;
    };
    let d = `M${pt(T[0].p1)}`;
    if (closed) {
      for (let i = 0; i < n; i++) d += ` L${pt(T[i].p2)}` + arc(cs[(i + 1) % n], T[i].p2, T[(i + 1) % n].p1);
      return d + ' Z';
    }
    for (let i = 0; i < pairs; i++) { if (i > 0) d += arc(cs[i], T[i - 1].p2, T[i].p1); d += ` L${pt(T[i].p2)}`; }
    return d;
  }

  function buildDiagram(m){
    const P = positions(m), byId = Object.fromEntries(P.map(p => [p.id, p]));
    const tandem = m.press.tandem && m.press.nips > 1;
    const twin = twinFormer(m);
    const tpRef = m.refiners.filter(r => /^t/i.test(r.name.trim())), bpRef = m.refiners.filter(r => !/^t/i.test(r.name.trim()));
    const refCols = Math.max(tpRef.length, bpRef.length);
    const segs = [
      ...(m.refiners.length ? [{ t: 'refiners', w: refCols * 84 + 16, secs: [{ id: 'sec-refiners', label: 'Refiners' }] }] : []),
      { t: 'former', w: 370, secs: twin
          ? [{ id: 'sec-topply', label: 'Top ply wire', part: 'top' }, { id: 'sec-baseply', label: 'Base ply wire', part: 'bottom' }]
          : [{ id: 'sec-forming', label: 'Forming' }] },
      { t: 'press', w: m.press.nips * 130, secs: [{ id: 'sec-press', label: 'Press section' }] },
      ...m.dryers.map((d, i) => ({ t: 'dryer', w: 280, d, s: i + 1, secs: [{ id: `sec-dryer-${i + 1}`, label: `${ord(i + 1)} dryer${d.type === 'uno' ? ' · unorun' : ''}` }] })),
      ...(m.calender ? [{ t: 'calender', w: 90, secs: [{ id: 'sec-calender', label: 'Calender' }] }] : []),
      { t: 'reel', w: 90, secs: [{ id: 'sec-reel', label: 'Reel' }] }
    ];
    W = segs.reduce((a, s) => a + s.w, 0) + GAP * (segs.length - 1) + PAD * 2;
    let x = W - PAD;
    for (const s of segs) { s.x1 = x; s.x0 = x - s.w; s.cx = (s.x0 + s.x1) / 2; x = s.x0 - GAP; }

    const back = [], items = [], top = [], sheetPaths = [];
    let dryerSheet = null;   // circles the sheet wraps through the dryer sections
    let sheet = [];   // current straight run of the sheet, flowing right → left
    const flushSheet = () => { if (sheet.length > 1) sheetPaths.push(`M${sheet.map(pt).join(' L')}`); sheet = []; };

    const badge = (id, bx, by) => {
      const d = daysOn(id), txt = d == null ? '—' : `${d} d`;
      const w = Math.max(44, txt.length * 11.5 + 22);
      return `<g class="bdg${d == null ? ' unset' : ''}"><rect x="${bx - w/2}" y="${by - 15}" width="${w}" height="30" rx="15"/><text x="${bx}" y="${by + 0.5}">${txt}</text></g>`;
    };
    const cls = id => { const st = status(id); return `it ${byId[id].kind}${selected === id ? ' sel' : ''}${st && st.level !== 'ok' ? ' ' + st.level : ''}`; };
    const open = (id) => `<g class="${cls(id)}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(byId[id].name)}" style="--fc:${CAT_COLOR[byId[id].cat]}"><title>${esc(byId[id].name)}</title>`;
    const deco = (c) => `<circle class="deco" cx="${c.x}" cy="${c.y}" r="${c.r}"/>`;
    // fabric as a belt (rounded rectangle) with optional corner rolls
    const belt = (id, x0, y0, x1, y1, corners, bx, by) => {
      const r = 24, cr = 9;
      let s = open(id) + `<rect class="halo" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${r}"/>` + `<rect class="hit" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${r}"/>`;
      s += `<rect class="belt" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${r}"/>`;
      const pts = { tl: [x0 + r, y0 + r], tr: [x1 - r, y0 + r], bl: [x0 + r, y1 - r], br: [x1 - r, y1 - r] };
      for (const c of corners) s += deco({ x: pts[c][0], y: pts[c][1], r: cr });
      return s + badge(id, bx, by) + '</g>';
    };
    // fabric that wraps a list of circles; small felt rolls (r < 12) are drawn as part of it
    const wrapBelt = (id, cs, bx, by) => {
      const d = wrapPath(cs, true);
      return open(id) + `<path class="halo" d="${d}"/><path class="hit" d="${d}"/><path class="belt" d="${d}"/>` +
        cs.filter(c => c.felt).map(deco).join('') + badge(id, bx, by) + '</g>';
    };
    const roll = (id, cx, cy, r, bx = cx, by = cy) =>
      open(id) + `<circle class="halo" cx="${cx}" cy="${cy}" r="${r + 6}" style="stroke-width:12"/><circle class="rl" cx="${cx}" cy="${cy}" r="${r}"/>` + badge(id, bx, by) + '</g>';
    const refiner = (id, name, rx, ry, by) =>
      open(id) + `<rect class="halo" x="${rx - 28}" y="${ry - 19}" width="56" height="38" rx="9"/>` +
        `<rect class="rf" x="${rx - 28}" y="${ry - 19}" width="56" height="38" rx="9"/><text class="rf-tx" x="${rx}" y="${ry + 1}">${esc(name)}</text>` +
        badge(id, rx, by) + '</g>';

    for (const s of segs) {
      const { x0, x1, cx } = s;
      if (s.t === 'refiners') {
        const rows = [[tpRef, 222, 184], [bpRef, 350, 388]];
        for (const [list, ry, by] of rows) {
          if (!list.length) continue;
          const xs = list.map((r, i) => x1 - 8 - 42 - i * 84);
          back.push(`<path class="pipe" d="M${xs[0]} ${ry} L${x0 - GAP - 6} ${ry} L${x0 - GAP - 6} ${ry < Y && twin ? 200 : 336} L${x0 - GAP - 70} ${ry < Y && twin ? 200 : 336}"/>`);
          list.forEach((r, i) => items.push(refiner(`ref-${r.id}`, r.name, xs[i], ry, by)));
        }
      } else if (s.t === 'former') {
        sheet.push([x1 - 70, Y]);
        items.push(belt('form-bottom', x0 + 4, Y + 4, x1 - 70, 410, ['tl', 'tr', 'bl', 'br'], (x0 + 4 + x1 - 70) / 2, 410));
        if (twin) items.push(belt('form-top', x0 + 105, 186, x1 - 70, Y - 4, ['tl', 'tr', 'bl', 'br'], (x0 + 105 + x1 - 70) / 2, 186));
        if (m.former.lumpbreaker) items.push(roll('lumpbreaker', x0 + 40, Y - 4 - 20, 20, x0 + 40, 230));
        sheet.push([x0, Y]);
      } else if (s.t === 'press') {
        for (let i = 0; i < m.press.nips; i++) {
          const n = i + 1, nx = x1 - 65 - i * 130;
          items.push(belt(`p${n}-felt-top`, nx - 55, 170, nx + 55, Y - 4, ['tl', 'tr'], nx, 170));
          if (!tandem) items.push(belt(`p${n}-felt-bottom`, nx - 55, Y + 4, nx + 55, 430, ['bl', 'br'], nx, 430));
        }
        if (tandem) items.push(belt('p-tandem-felt', x0 + 10, Y + 4, x1 - 10, 430, ['bl', 'br'], cx, 430));
        for (let i = 0; i < m.press.nips; i++) {
          const n = i + 1, nx = x1 - 65 - i * 130;
          top.push(roll(`p${n}-roll-top`, nx, Y - 4 - 30, 30));
          top.push(roll(`p${n}-roll-bottom`, nx, Y + 4 + 30, 30));
        }
        sheet.push([x0, Y]);
      } else if (s.t === 'dryer') {
        // Traced from the operator's sketch:
        //  - Sheet runs over the top cans and under the bottom cans (vacuum rolls in the unorun), and dips under a
        //    transfer roll between sections.
        //  - Top felt runs over the top cans and dips around felt rolls in the pockets between them; bottom felt runs
        //    under the bottom cans with a felt roll in the pocket above. Lead rolls at each end, return run outside.
        //  - Unorun: one felt over the top cans and under the vacuum rolls (sheet outside the felt on the vacuum rolls).
        const CR = 26, TY = 236, BY = 336, VR = 16, VY = 318;
        const tops = [x1 - 56, x1 - 140, x1 - 224], bots = [x1 - 98, x1 - 182];
        const uno = s.d.type === 'uno', last = s.s === m.dryers.length;
        tops.forEach(tx => back.push(`<circle class="cyl" cx="${tx}" cy="${TY}" r="${CR}"/>`));
        bots.forEach(bx => back.push(uno ? `<circle class="cyl" cx="${bx}" cy="${VY}" r="${VR}"/>` : `<circle class="cyl" cx="${bx}" cy="${BY}" r="${CR}"/>`));
        // sheet: one continuous wrap path through all dryer sections
        if (s.s === 1) { sheet.push([x1, Y]); flushSheet(); dryerSheet = [{ x: x1, y: Y, r: 0, s: 1 }]; }
        tops.forEach((tx, i) => {
          dryerSheet.push({ x: tx, y: TY, r: CR + 1.5, s: -1 });
          if (bots[i] != null) dryerSheet.push(uno ? { x: bots[i], y: VY, r: VR + 6, s: 1 } : { x: bots[i], y: BY, r: CR + 1.5, s: 1 });
        });
        const trX = x0 - GAP / 2, trY = 290, trR = 8;
        back.push(`<circle class="cyl" cx="${trX}" cy="${trY}" r="${trR}"/>`);
        dryerSheet.push({ x: trX, y: trY, r: trR + 1.5, s: 1 });
        if (last) {
          dryerSheet.push({ x: x0 - GAP, y: Y, r: 0, s: 1 });
          sheetPaths.push(wrapPath(dryerSheet, false));
          dryerSheet = null;
          sheet.push([x0 - GAP, Y]);
        }
        // felts
        const FR = CR + 5, fr = (x, y, r, s) => ({ x, y, r, s, felt: true });
        if (uno) {
          const cs = [fr(tops[0] + 54, 192, 8, 1)];
          tops.forEach((tx, i) => {
            cs.push({ x: tx, y: TY, r: FR, s: -1 });
            if (bots[i] != null) cs.push({ x: bots[i], y: VY, r: VR + 2.5, s: 1 });
          });
          cs.push(fr(tops[2] - 32, 192, 8, 1), fr(tops[2] - 32, 150, 8, 1), fr(tops[0] + 54, 150, 8, 1));
          items.push(wrapBelt(`d${s.s}-felt`, cs, cx, 142));
        } else {
          const ct = [fr(tops[0] + 28, 204, 8, 1)];
          tops.forEach((tx, i) => {
            ct.push({ x: tx, y: TY, r: FR, s: -1 });
            if (tops[i + 1] != null) ct.push(fr((tx + tops[i + 1]) / 2, 230, 7, 1));
          });
          ct.push(fr(tops[2] - 28, 204, 8, 1), fr(tops[2] - 28, 150, 8, 1), fr(tops[0] + 28, 150, 8, 1));
          items.push(wrapBelt(`d${s.s}-felt-top`, ct, cx, 142));
          const cb = [fr(bots[0] + 48, 340, 8, -1)];
          bots.forEach((bx, i) => {
            cb.push({ x: bx, y: BY, r: FR, s: 1 });
            if (bots[i + 1] != null) cb.push(fr((bx + bots[i + 1]) / 2, 342, 7, -1));
          });
          cb.push(fr(bots[1] - 48, 340, 8, -1), fr(bots[1] - 48, 430, 8, -1), fr(bots[0] + 48, 430, 8, -1));
          items.push(wrapBelt(`d${s.s}-felt-bottom`, cb, cx, 438));
        }
      } else if (s.t === 'calender') {
        top.push(roll('cal-top', cx, Y - 30, 30));
        top.push(roll('cal-bottom', cx, Y + 30, 30));
        sheet.push([x0, Y]);
      } else if (s.t === 'reel') {
        back.push(`<circle class="cyl" cx="${cx}" cy="330" r="26"/>`);
        back.push(`<circle class="spool" cx="${cx}" cy="264" r="40"/><circle class="core" cx="${cx}" cy="264" r="9"/>`);
        sheet.push([x1, Y]); flushSheet();
        const sr = 41.5, k = Math.SQRT1_2;
        sheetPaths.push(wrapPath([{ x: x1, y: Y, r: 0, s: 1 }, { x: cx, y: 264, r: sr, s: -1 }], false) + ` A${sr} ${sr} 0 0 0 ${pt([cx - sr * k, 264 - sr * k])}`);
      }
    }
    flushSheet();

    // clickable sections (background hit areas + brackets/labels)
    const secName = Object.fromEntries(sections(m).map(q => [q.id, q.name]));
    const secs = segs.map(s => {
      if (s.plain) return `<path class="sec-ln" d="M${s.x0} 480 L${s.x0} 486 L${s.x1} 486 L${s.x1} 480"/><text class="sec-tx plain" x="${s.cx}" y="510">${esc(s.plain)}</text>`;
      return s.secs.map(q => {
        const isTop = q.part === 'top';
        const y0 = isTop ? VB_TOP : q.part === 'bottom' ? 288 : VB_TOP, y1 = isTop ? 288 : VB_BOT;
        const lx0 = isTop ? s.x0 + 105 : s.x0, lx1 = isTop ? s.x1 - 2 : s.x1, lcx = (lx0 + lx1) / 2;
        const lbl = isTop
          ? `<path class="sec-ln" d="M${lx0} 160 L${lx0} 154 L${lx1} 154 L${lx1} 160"/><text class="sec-tx" x="${lcx}" y="140">${esc(q.label)}</text>`
          : `<path class="sec-ln" d="M${lx0} 480 L${lx0} 486 L${lx1} 486 L${lx1} 480"/><text class="sec-tx" x="${lcx}" y="510">${esc(q.label)}</text>`;
        return `<g class="sec${selectedSec === q.id ? ' sel' : ''}" data-sec="${q.id}" tabindex="0" role="button" aria-label="${esc(secName[q.id])}"><title>${esc(secName[q.id])}</title>` +
          `<rect class="secbg" x="${s.x0 - GAP / 2}" y="${y0}" width="${s.w + GAP}" height="${y1 - y0}" rx="10"/>${lbl}</g>`;
      }).join('');
    }).join('');
    // machine direction arrow (top-left, pointing left)
    const md = `<g class="md"><path class="md-arrow" d="M${PAD} 124 l16 -9 v6 h56 v6 h-56 v6 z"/><text class="md-tx" x="${PAD + 82}" y="125" dominant-baseline="central">Machine direction</text></g>`;
    const sheetSvg = sheetPaths.map(d => `<path class="sheet-ln" d="${d}"/>`).join('');

    return `<g>${secs}</g>${md}<g>${back.join('')}</g>${sheetSvg}<g>${items.join('')}</g><g>${top.join('')}</g>`;
  }

  function renderDiagram(m){
    const svg = $('diagram');
    svg.innerHTML = buildDiagram(m);
    svg.setAttribute('viewBox', `0 ${VB_TOP} ${W} ${VB_BOT - VB_TOP}`);
    applyZoom();
  }
  function fitScale(){ const avail = $('diagramScroll').clientWidth - 8; return Math.max(0.3, Math.min(1.25, avail / W)); }
  function applyZoom(){
    const sc = zoom === 'fit' ? fitScale() : zoom;
    const svg = $('diagram');
    svg.setAttribute('width', Math.round(W * sc));
    svg.setAttribute('height', Math.round((VB_BOT - VB_TOP) * sc));
    $('zoomPct').textContent = zoom === 'fit' ? 'Fit' : Math.round(sc * 100) + '%';
  }
  function stepZoom(dir){
    const cur = zoom === 'fit' ? fitScale() : zoom;
    zoom = Math.min(2, Math.max(0.3, Math.round((cur + dir * 0.15) * 100) / 100));
    applyZoom();
  }

  /* ---------- Tables & summary ---------- */
  function renderTables(m){
    const P = positions(m);
    const row = p => {
      const it = S.items[p.id] || {}, d = daysOn(p.id), st = status(p.id), lv = st ? st.level : '';
      const left = st ? `<div class="left ${lv}">${st.left < 0 ? fmtSpan(st.left) + ' overdue' : st.left === 0 ? 'due today' : fmtSpan(st.left) + ' left'}</div>` : '';
      return `<tr data-id="${p.id}" class="${selected === p.id ? 'sel ' : ''}${lv}">
        <td><div class="pname" style="--fc:${CAT_COLOR[p.cat]}"><span class="sw"></span>${esc(p.name)}</div><div class="psec">${esc(p.section)}</div></td>
        <td class="dt">${fmtDate(it.installed)}</td>
        <td class="dt">${fmtTarget(p.id)}</td>
        <td class="r"><span class="days${d == null ? ' unset' : ''} ${lv}">${d == null ? 'not set' : d + ' d'}</span>${left}</td></tr>`;
    };
    $('fabRows').innerHTML = P.filter(p => p.kind === 'fabric').map(row).join('');
    $('rollRows').innerHTML = P.filter(p => p.kind === 'roll').map(row).join('');
    const refs = P.filter(p => p.kind === 'refiner');
    $('refCard').hidden = !refs.length;
    $('refRows').innerHTML = refs.map(row).join('');
    const fab = P.filter(p => p.kind === 'fabric').length, rl = P.filter(p => p.kind === 'roll').length, rf = P.length - fab - rl;
    const unset = P.filter(p => daysOn(p.id) == null).length;
    const over = P.filter(p => (status(p.id) || {}).level === 'over').length;
    const soon = P.filter(p => (status(p.id) || {}).level === 'soon').length;
    $('summary').innerHTML = `<span class="chip">${fab} fabrics</span><span class="chip">${rl} rolls</span>` + (rf ? `<span class="chip">${rf} refiners</span>` : '') +
      (over ? `<span class="chip over">${over} overdue</span>` : '') +
      (soon ? `<span class="chip soon">${soon} due within 6 wks</span>` : '') +
      (unset ? `<span class="chip warn">${unset} not set</span>` : '');
    $('machName').textContent = m.name ? `${m.name} · fabric & roll ages` : 'Fabric & roll ages';
  }

  function renderAll(){
    const m = draft || S.machine || normalize(clone(DEFAULT_MACHINE));
    renderDiagram(m);
    renderTables(m);
  }

  /* ---------- Drawer: item editor ---------- */
  const drawer = $('drawer');
  function openDrawer(html){
    drawer.innerHTML = html; drawer.hidden = false;
    document.body.classList.add('drawer-open');
    requestAnimationFrame(applyZoom);
  }
  function closeDrawer(){
    drawer.hidden = true; drawer.innerHTML = '';
    document.body.classList.remove('drawer-open');
    if (draft) { draft = null; }
    selected = null; selectedSec = null;
    renderAll();
  }

  function openItem(id){
    if (draft) return; // Setup is open
    const p = positions(S.machine).find(q => q.id === id);
    if (!p) return;
    selected = id; selectedSec = null;
    renderAll();
    const it = S.items[id] || {}, tg = targetOf(id), isRef = p.kind === 'refiner';
    const d = daysOn(id);
    const hist = (it.history || []).slice().reverse();
    const st = status(id);
    const dueBox = st
      ? `<div class="due ${st.level}">${st.level === 'over'
          ? `<b>Overdue by ${fmtSpan(st.left)}</b><br>Change was due ${fmtDate(st.due)}`
          : `<b>${st.left === 0 ? 'Due today' : fmtSpan(st.left) + ' left'}</b><br>Change due ${fmtDate(st.due)}`}</div>`
      : (tg ? `<div class="due">Set ${isRef ? 'the plate install date' : 'an install date'} to see when ${isRef ? 'plates are' : 'this is'} due.</div>` : '');
    openDrawer(`
      <div class="d-head" style="--fc:${CAT_COLOR[p.cat]}">
        <div><div class="kind">${KIND_LABEL[p.kind]}</div><div class="where">${esc(p.section)}</div></div>
        <button class="x" data-act="close" aria-label="Close">✕</button>
      </div>
      <div class="d-body">
        <h3>${esc(p.name)}</h3>
        <div class="big${d == null ? ' unset' : ''}">${d == null ? `<b>No ${isRef ? 'plate ' : ''}install date</b>` : `<b>${d}</b><span>day${d === 1 ? '' : 's'} on ${isRef ? 'plates' : 'machine'}</span>`}</div>
        <div class="fld">
          <label for="inst">${isRef ? 'Plates installed' : 'Installed'}</label>
          <div class="row">
            <input id="inst" type="date" value="${it.installed || ''}" max="${todayStr()}">
            <button class="btn sm" data-act="today">Today</button>
            ${it.installed ? '<button class="btn sm" data-act="clear">Clear</button>' : ''}
          </div>
        </div>
        <div class="fld">
          <label for="tgt">${isRef ? 'Target plate life' : 'Target life'}</label>
          <div class="row">
            <input id="tgt" type="number" min="1" step="1" inputmode="numeric" value="${tg ? tg.target : ''}" placeholder="e.g. 26">
            <select id="tgtUnit"><option value="weeks"${!tg || tg.unit === 'weeks' ? ' selected' : ''}>weeks</option><option value="days"${tg && tg.unit === 'days' ? ' selected' : ''}>days</option></select>
          </div>
          <span class="hint">Turns yellow within 6 weeks of the target, red once it’s past.${tg && tg.dflt ? ' Default for refiner plates is 12 weeks.' : ''}</span>
        </div>
        ${dueBox}
        <div class="fld">
          <label for="note">Notes</label>
          <textarea id="note" placeholder="Vendor, style, serial number, condition…">${esc(it.note || '')}</textarea>
        </div>
        ${it.installed ? `<div class="fld">
          <span class="lbl">Changed out</span>
          <div class="row"><button class="btn danger" data-act="replace">${isRef ? 'Plates changed today' : 'Replaced today'}</button></div>
          <span class="hint">Logs the current run below and restarts the count from today.</span>
        </div>` : ''}
        ${hist.length ? `<div class="fld"><span class="lbl">${isRef ? 'Previous plate sets' : 'Previous runs'}</span><div class="hist">${hist.map((h, i) =>
          `<div class="hrow"><span class="tt">${fmtDate(h.installed)} → ${fmtDate(h.removed)} · <b>${h.days} d</b></span><button class="rm" data-act="delhist" data-i="${hist.length - 1 - i}" title="Remove">✕</button></div>`).join('')}</div></div>` : ''}
      </div>`);
    drawer.dataset.mode = 'item';
    drawer.dataset.id = id;
  }

  function openSection(secId){
    if (draft) return; // Setup is open
    const m = S.machine, sec = sections(m).find(q => q.id === secId);
    if (!sec) return;
    selected = null; selectedSec = secId;
    renderAll();
    const P = positions(m).filter(p => p.section === sec.name);
    const over = P.filter(p => (status(p.id) || {}).level === 'over').length;
    const soon = P.filter(p => (status(p.id) || {}).level === 'soon').length;
    const rows = P.map(p => {
      const d = daysOn(p.id), st = status(p.id), lv = st ? st.level : '';
      const left = st ? (st.left < 0 ? fmtSpan(st.left) + ' overdue' : st.left === 0 ? 'due today' : fmtSpan(st.left) + ' left') : '';
      return `<button class="srow ${lv}" data-act="item" data-id="${p.id}" style="--fc:${CAT_COLOR[p.cat]}">
        <span class="sw"></span><span class="nm">${esc(p.name)}<small>${KIND_LABEL[p.kind]}${left ? ' · ' + left : ''}</small></span>
        <span class="days${d == null ? ' unset' : ''} ${lv}">${d == null ? 'not set' : d + ' d'}</span></button>`;
    }).join('');
    openDrawer(`
      <div class="d-head">
        <div><div class="kind" style="color:var(--ink)">Section</div><div class="where">${esc(m.name || '')}</div></div>
        <button class="x" data-act="close" aria-label="Close">✕</button>
      </div>
      <div class="d-body">
        <h3>${esc(sec.name)}</h3>
        ${over || soon ? `<div class="row">${over ? `<span class="chip over">${over} overdue</span>` : ''}${soon ? `<span class="chip soon">${soon} due within 6 wks</span>` : ''}</div>` : ''}
        ${P.length ? `<div class="fld"><span class="lbl">Tracked here</span><div class="slist">${rows}</div></div>` : '<span class="hint">Nothing tracked in this section yet.</span>'}
        <span class="hint">More for this section is coming in a later version.</span>
      </div>`);
    drawer.dataset.mode = 'section';
    drawer.dataset.id = secId;
  }

  function setItem(id, patch){
    const it = S.items[id] = Object.assign({ installed: '', note: '', history: [] }, S.items[id] || {}, patch);
    if (!it.installed && !it.note && !(it.target > 0) && !(it.history || []).length) delete S.items[id];
    save();
  }

  let armTimer;
  drawer.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = drawer.dataset.id;
    if (act === 'close') return closeDrawer();
    if (drawer.dataset.mode === 'setup') return setupAction(act, b);
    if (act === 'item') return openItem(b.dataset.id);
    if (act === 'today') { setItem(id, { installed: todayStr() }); openItem(id); }
    else if (act === 'clear') { setItem(id, { installed: '' }); openItem(id); }
    else if (act === 'replace') {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = 'Click again to confirm';
        clearTimeout(armTimer); armTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = drawer.dataset.id.startsWith('ref-') ? 'Plates changed today' : 'Replaced today'; }, 3000);
        return;
      }
      const it = S.items[id], t = todayStr();
      const history = (it.history || []).concat([{ installed: it.installed, removed: t, days: Math.max(0, daysBetween(it.installed, t)) }]);
      setItem(id, { installed: t, history });
      toast(id.startsWith('ref-') ? 'New plate set started today' : 'New run started today');
      openItem(id);
    } else if (act === 'delhist') {
      const history = (S.items[id].history || []).slice(); history.splice(+b.dataset.i, 1);
      setItem(id, { history }); openItem(id);
    }
  });
  drawer.addEventListener('change', e => {
    if (drawer.dataset.mode === 'setup') return setupChange(e);
    if (e.target.id === 'inst') {
      let v = e.target.value;
      if (v && v > todayStr()) { v = todayStr(); toast('Install date can’t be in the future'); }
      setItem(drawer.dataset.id, { installed: v }); openItem(drawer.dataset.id);
    } else if (e.target.id === 'tgt' || e.target.id === 'tgtUnit') {
      const n = Math.round(Number($('tgt').value));
      setItem(drawer.dataset.id, { target: n > 0 ? n : 0, targetUnit: $('tgtUnit').value });
      openItem(drawer.dataset.id);
    }
  });
  drawer.addEventListener('input', e => {
    if (drawer.dataset.mode === 'setup') return setupChange(e);
    if (e.target.id === 'note') setItem(drawer.dataset.id, { note: e.target.value });
  });

  /* ---------- Drawer: machine setup ---------- */
  let firstRun = false;
  function openSetup(first){
    firstRun = !!first;
    selected = null;
    draft = normalize(clone(S.machine || DEFAULT_MACHINE));
    drawer.dataset.mode = 'setup';
    drawSetup();
    renderAll();
  }
  function drawSetup(){
    const m = draft;
    const nipsOpt = [1, 2, 3].map(n => `<option value="${n}"${m.press.nips === n ? ' selected' : ''}>${n} nip${n > 1 ? 's' : ''}</option>`).join('');
    const dry = m.dryers.map((d, i) => `<div class="dsec"><span class="n">Section ${i + 1}</span>
      <select data-dry="${i}"><option value="uno"${d.type === 'uno' ? ' selected' : ''}>Unorun — single felt</option><option value="double"${d.type === 'double' ? ' selected' : ''}>Top &amp; bottom felts</option></select>
      <button class="ib" data-act="deldry" data-i="${i}" title="Remove section"${m.dryers.length < 2 ? ' disabled' : ''}>✕</button></div>`).join('');
    openDrawer(`
      <div class="d-head"><div><div class="kind" style="color:var(--ink)">Machine setup</div><div class="where">Headbox on the right, reel on the left</div></div>
        ${firstRun ? '' : '<button class="x" data-act="close" aria-label="Close">✕</button>'}</div>
      <div class="d-body">
        ${firstRun ? '<div class="welcome"><b>Welcome.</b> Lay out your machine below; the diagram updates as you go. You can change this any time from <b>Setup</b>.</div>' : ''}
        <div class="fld"><label for="mName">Machine name</label><input id="mName" type="text" value="${esc(m.name)}" placeholder="PM1"></div>
        <div class="group" style="--fc:var(--c-refiner)"><h4><span class="sw"></span>Refiners</h4>
          ${m.refiners.map((r, i) => `<div class="dsec"><input type="text" class="rname" data-ref="${i}" value="${esc(r.name)}" placeholder="e.g. TP 1"><button class="ib" data-act="delref" data-i="${i}" title="Remove refiner">✕</button></div>`).join('')}
          <div><button class="btn sm" data-act="addref"${m.refiners.length >= 8 ? ' disabled' : ''}>+ Add refiner</button></div>
          <span class="hint">Names starting with T are drawn in the top row (top ply), the rest below (base ply). Plate life target defaults to 12 weeks.</span>
        </div>
        <div class="group" style="--fc:var(--c-forming)"><h4><span class="sw"></span>Forming</h4>
          <div class="fld"><select id="fType">
            <option value="twin"${m.former.type === 'twin' ? ' selected' : ''}>Top ply &amp; base ply wires</option>
            <option value="fourdrinier"${m.former.type === 'fourdrinier' ? ' selected' : ''}>Single forming fabric</option></select></div>
          <label class="ck"><input id="fLump" type="checkbox"${m.former.lumpbreaker ? ' checked' : ''}> Lumpbreaker roll</label>
        </div>
        <div class="group" style="--fc:var(--c-press)"><h4><span class="sw"></span>Press</h4>
          <div class="fld"><select id="pNips">${nipsOpt}</select></div>
          <label class="ck${m.press.nips < 2 ? ' dis' : ''}"><input id="pTandem" type="checkbox"${m.press.tandem ? ' checked' : ''}${m.press.nips < 2 ? ' disabled' : ''}> Tandem bottom felt through all nips</label>
          <span class="hint">Each nip gets a top felt and a top &amp; bottom roll. Without tandem, each nip also gets its own bottom felt.</span>
        </div>
        <div class="group" style="--fc:var(--c-dryer)"><h4><span class="sw"></span>Dryers</h4>
          ${dry}
          <div><button class="btn sm" data-act="adddry"${m.dryers.length >= 8 ? ' disabled' : ''}>+ Add section</button></div>
        </div>
        <div class="group" style="--fc:var(--c-roll)"><h4><span class="sw"></span>Calender &amp; reel</h4>
          <label class="ck"><input id="cal" type="checkbox"${m.calender ? ' checked' : ''}> Calender (top &amp; bottom roll)</label>
          <span class="hint">The reel is always shown.</span>
        </div>
        ${firstRun ? '' : '<span class="hint">Removing a position hides it but keeps its dates; add it back and they return.</span>'}
      </div>
      <div class="d-foot">
        ${firstRun ? '' : '<button class="btn" data-act="close">Cancel</button>'}
        <span class="spacer"></span>
        <button class="btn primary" data-act="savesetup">${firstRun ? 'Create machine' : 'Save'}</button>
      </div>`);
    drawer.dataset.mode = 'setup';
  }
  function setupChange(e){
    const t = e.target, m = draft;
    if (t.id === 'mName') { m.name = t.value; renderTables(m); return; }
    if (t.dataset.ref != null) { m.refiners[+t.dataset.ref].name = t.value; renderAll(); return; }
    if (e.type === 'input') return;
    if (t.id === 'fType') m.former.type = t.value;
    else if (t.id === 'fLump') m.former.lumpbreaker = t.checked;
    else if (t.id === 'pNips') m.press.nips = +t.value;
    else if (t.id === 'pTandem') m.press.tandem = t.checked;
    else if (t.id === 'cal') m.calender = t.checked;
    else if (t.dataset.dry != null) m.dryers[+t.dataset.dry].type = t.value;
    drawSetup(); renderAll();
  }
  function setupAction(act, b){
    if (act === 'addref') { draft.refiners.push({ id: 'r' + Date.now().toString(36), name: '' }); drawSetup(); renderAll(); const ins = drawer.querySelectorAll('.rname'); if (ins.length) ins[ins.length - 1].focus(); return; }
    if (act === 'delref') { draft.refiners.splice(+b.dataset.i, 1); drawSetup(); renderAll(); return; }
    if (act === 'adddry') { draft.dryers.push({ type: 'double' }); drawSetup(); renderAll(); }
    else if (act === 'deldry') { draft.dryers.splice(+b.dataset.i, 1); drawSetup(); renderAll(); }
    else if (act === 'savesetup') {
      draft.name = (draft.name || '').trim() || 'PM1';
      draft.refiners.forEach((r, i) => { r.name = (r.name || '').trim() || `Refiner ${i + 1}`; });
      S.machine = draft; save();
      const wasFirst = firstRun; firstRun = false;
      closeDrawer();
      toast(wasFirst ? 'Machine created. Click any fabric, roll or refiner to set its install date.' : 'Machine updated');
    }
  }

  /* ---------- Export / import ---------- */
  function exportJSON(){
    const P = positions(S.machine);
    const data = {
      app: 'machine-manager-mymachine', version: VERSION, exported: new Date().toISOString(),
      machine: S.machine, items: S.items,
      // flattened, human/LLM-readable view of current state (ignored on import)
      positions: P.map(p => ({ id: p.id, name: p.name, type: p.kind, section: p.section,
        installed: (S.items[p.id] || {}).installed || null, daysOn: daysOn(p.id), targetLifeDays: lifeDays(p.id),
        dueDate: (status(p.id) || {}).due || null, daysLeft: status(p.id) ? status(p.id).left : null,
        status: status(p.id) ? { ok: 'ok', soon: 'due within 6 weeks', over: 'overdue' }[status(p.id).level] : null,
        note: (S.items[p.id] || {}).note || '' }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `my-machine-${(S.machine.name || 'machine').replace(/[^\w-]+/g, '_')}-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importJSON(file){
    try {
      const d = JSON.parse(await file.text());
      if (!d || !d.machine || !d.machine.press || !Array.isArray(d.machine.dryers)) throw new Error('bad');
      const prev = clone(S);
      S = { machine: normalize(d.machine), items: d.items || {} };
      if (draft) { draft = null; }
      drawer.hidden = true; document.body.classList.remove('drawer-open'); selected = null;
      save(); renderAll();
      toast(`Imported ${S.machine.name || 'machine'}`, 'Undo', () => { S = prev; save(); renderAll(); });
    } catch (e) { toast('That file isn’t a My Machine export'); }
  }

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg, actLabel, fn){
    const t = $('toast');
    t.innerHTML = esc(msg) + (actLabel ? `<button>${esc(actLabel)}</button>` : '');
    t.classList.toggle('act', !!actLabel);
    if (actLabel) t.querySelector('button').onclick = () => { fn(); t.classList.remove('show'); };
    t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), actLabel ? 6000 : 2600);
  }

  /* ---------- Events ---------- */
  $('diagram').addEventListener('click', e => {
    const g = e.target.closest('.it'), sg = e.target.closest('.sec');
    if (g) openItem(g.dataset.id);
    else if (sg) openSection(sg.dataset.sec);
    else if (!draft && !drawer.hidden) closeDrawer();
  });
  $('diagram').addEventListener('keydown', e => {
    const g = e.target.closest('.it'), sg = e.target.closest('.sec');
    if ((g || sg) && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g ? openItem(g.dataset.id) : openSection(sg.dataset.sec); }
  });
  ['fabRows', 'rollRows', 'refRows'].forEach(id => $(id).addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (tr) openItem(tr.dataset.id);
  }));
  $('setupBtn').onclick = () => openSetup(false);
  $('exportBtn').onclick = exportJSON;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };
  $('zoomIn').onclick = () => stepZoom(1);
  $('zoomOut').onclick = () => stepZoom(-1);
  $('zoomPct').onclick = () => { zoom = 'fit'; applyZoom(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !drawer.hidden && !firstRun) closeDrawer();
  });
  new ResizeObserver(() => { if (zoom === 'fit') applyZoom(); }).observe($('diagramScroll'));
  // Day counts roll over at midnight: refresh when the window comes back into view.
  let lastDay = todayStr();
  const refreshDay = () => { if (todayStr() !== lastDay) { lastDay = todayStr(); renderAll(); if (!drawer.hidden && drawer.dataset.mode === 'item') openItem(drawer.dataset.id); else if (!drawer.hidden && drawer.dataset.mode === 'section') openSection(drawer.dataset.id); } };
  window.addEventListener('focus', refreshDay);
  setInterval(refreshDay, 60000);

  /* ---------- Start ---------- */
  (async () => {
    if (window.MMCloud && MMCloud.enabled){
      MMCloud.mountAccount($('acct'), { compact: true });
      cloud = MMCloud.openStore('mymachine', { snapshot: toRecords, onChange: onRemote, onStatus: cloudStatus });
      let data = null;
      try { data = await cloud.ready; }
      catch (e) { toast('Can’t reach the server — showing this browser’s copy.'); }
      if (data){
        S = fromRecords(data);
        // First time signed in: offer to bring over a machine set up in demo mode.
        const local = readLocal(), askKey = `mm-mymachine-copy-asked:${cloud.org.id}`;
        let asked = false; try { asked = !!localStorage.getItem(askKey); } catch (e) {}
        if (!S.machine && local && cloud.edit && !asked){
          try { localStorage.setItem(askKey, '1'); } catch (e) {}
          const n = Object.values(local.items).filter(it => it.installed).length;
          if (confirm(`This browser has a machine saved from before you signed in (${local.machine.name}, ${n} install date${n === 1 ? '' : 's'}).\n\nCopy it to ${cloud.org.name} so your team can see it?`)){
            S = local; save(); toast(`Copied ${local.machine.name} to ${cloud.org.name}`);
          }
        }
        if (!S.machine && !cloud.edit) toast(`No machine has been set up for ${cloud.org.name} yet. Ask an editor to set it up.`);
      } else cloud = null;            // signed out or no organization: demo mode
    }
    if (!cloud) load();
    if (!S.machine && (!cloud || cloud.edit)) openSetup(true);
    else renderAll();
  })();
})();
</script>
</body>
</html>
