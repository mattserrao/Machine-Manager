name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: mm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: pg
      PGDSN: host=localhost dbname=mm_test user=postgres password=pg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "psycopg[binary]"
      - name: Load the schema (twice, to prove it can be re-run)
        run: |
          psql -h localhost -U postgres -d mm_test -v ON_ERROR_STOP=1 -q -f tests/db/supabase-shim.sql -f supabase/schema.sql -f supabase/schema.sql -f supabase/llm.sql -f supabase/llm.sql
      - run: python tests/db/test_schema.py
      - run: python tests/db/test_llm.py

  answer-key:
    # Generate the demo year, load it through the importers into a fresh database, and check that the
    # tool functions can answer every demo question (as a signed-in viewer, so RLS applies).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: mm_demo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: pg
      DSN: host=localhost dbname=mm_demo user=postgres password=pg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr poppler-utils
      - run: pip install "psycopg[binary]" pyyaml openpyxl numpy reportlab pypdf python-docx pillow
      - name: Generate the demo year
        run: python3 tools/demo-data/structured.py && python3 tools/demo-data/pi_bonvoy.py && python3 tools/demo-data/docs.py && python3 tools/demo-data/downtime_feed.py
      - name: Load and verify
        run: |
          psql -h localhost -U postgres -d mm_demo -v ON_ERROR_STOP=1 -q -f tests/db/supabase-shim.sql -f supabase/schema.sql -f supabase/llm.sql
          TOKEN=$(psql -h localhost -U postgres -d mm_demo -Atc "select public.mm_llm_new_ingest_token('Demo Mill', 1)")
          python3 tools/ingest/load.py --source demo-data/out --backbone demo-data/backbone --dsn "$DSN" --token "$TOKEN"
          python3 tools/ingest/verify_answers.py --dsn "$DSN" --org "Demo Mill"
      - name: Sim Mill (the model's year) — load and verify
        run: |
          python3 tools/sim-mill/run.py
          TOKEN=$(psql -h localhost -U postgres -d mm_demo -Atc "select public.mm_llm_new_ingest_token('Sim Mill', 1)")
          python3 tools/ingest/load.py --source demo-data/sim-mill/out --backbone demo-data/sim-mill/backbone --dsn "$DSN" --token "$TOKEN"
          python3 tools/ingest/verify_answers.py --dsn "$DSN" --org "Sim Mill"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tests/unit/machine.test.js
      - run: node tests/sync/sync_sim.js
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml openpyxl numpy reportlab pypdf python-docx pillow
      - run: python3 tools/demo-data/backbone.py --check
      - run: python3 tools/demo-data/structured.py --check
      - name: Pi + Bonvoy (needs phase 2's _truth, so generate it first)
        run: python3 tools/demo-data/structured.py && python3 tools/demo-data/pi_bonvoy.py --check
      - name: Documents (needs phases 2–3 output)
        run: python3 tools/demo-data/pi_bonvoy.py && python3 tools/demo-data/docs.py --check
      - run: python3 tools/sim-mill/run.py --check
      - run: python3 tools/sim-mill/validate_ref.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Serve the site
        run: python -m http.server 8000 & sleep 1
      - run: python tests/browser/smoke.py http://localhost:8000/
      - run: python tests/browser/boards.py http://localhost:8000/
      - run: python tests/browser/signed_in.py http://localhost:8000/
      - run: python tests/browser/theme.py http://localhost:8000/
      - run: python tests/browser/outages_demo.py http://localhost:8000/
      - run: python tests/browser/consumables_organizer.py http://localhost:8000/
      - run: python tests/browser/demo_sim_mill.py http://localhost:8000/

  version-stamps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: All pages use one stamp
        run: python3 tools/stamp.py --check
      - name: Shared files changed → new stamp
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          changed=$(git diff --name-only "$base"...HEAD -- 'mm-*.js' 'mm-*.css' 'vendor/*')
          if [ -n "$changed" ]; then
            old=$(git show "$base":index.html | grep -o '?v=[^"]*' | head -1)
            new=$(grep -o '?v=[^"]*' index.html | head -1)
            if [ "$old" = "$new" ]; then
              echo "Shared files changed ($changed) but the version stamp is still $new. Run: python3 tools/stamp.py"; exit 1
            fi
          fi
