<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="mm-theme.js?v=2026-11-08.2126"></script>
<link rel="stylesheet" href="mm-theme.css?v=2026-11-08.2126">
<link rel="stylesheet" href="mm-data.css?v=2026-11-08.2126">
<script src="mm-icons.js?v=2026-11-08.2126"></script>
<style>
  .dbar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer}
  .dbar button:hover{border-color:var(--line-strong)}
  .dayh{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
  .dayh h2{margin:0;font-size:20px;font-weight:600}
  .dayh span{font-size:13px;color:var(--muted)}
  a.nb{font-size:12px;color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header class="mm-top">
  <div class="bar brand">
    <button class="logo mmnav" type="button" aria-label="Switch app" aria-haspopup="menu" aria-expanded="false" title="Switch app"></button>
    <div><h1>Daily</h1><p>The mill day: production, downtime, the BUS sheet and Envoy</p></div>
  </div>
  <div id="acct"></div>
</header>
<main class="data">
  <div class="dbar">
    <span class="org" id="org"></span>
    <button id="prev" type="button" title="Previous day">‹</button>
    <input id="day" type="date" aria-label="Day">
    <button id="next" type="button" title="Next day">›</button>
    <button id="toToday" type="button">Today</button>
    <span class="grow"></span>
    <a class="nb" href="DailyNotes.html">Notes board</a>
  </div>
  <div id="body"><div class="dmsg">Loading…</div></div>
  <div id="ver"></div>
</main>
<script src="vendor/supabase-2.119.0.js?v=2026-11-08.2126"></script>
<script src="mm-config.js?v=2026-11-08.2126"></script>
<script src="mm-cloud.js?v=2026-11-08.2126"></script>
<script src="mm-llm-org.js?v=2026-11-08.2126"></script>
<script>
  const VERSION = 'v0.2.0';
  document.getElementById('ver').textContent = 'Daily ' + VERSION;
  MMCloud.mountAccount(document.getElementById('acct'), { compact: true });
  const $ = id => document.getElementById(id), O = MMLLMOrg, esc = O.esc;
  let st, today, outages = [];
  const addDays = (d, n) => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const NY = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
  const millHour = ts => { const p = Object.fromEntries(NY.formatToParts(new Date(ts)).map(x => [x.type, x.value])); return `${p.year}-${p.month}-${p.day}T${p.hour}`; };
  const KIND = { planned: 'Planned', unplanned: 'Unplanned', break: 'Sheet break', slowdown: 'Slowdown' };

  function tile(v, label, warn){ return `<div class="tile${warn ? ' warn' : ''}"><b>${v}</b><span>${esc(label)}</span></div>`; }
  function panel(title, sub, el){ const p = document.createElement('section'); p.className = 'panel'; p.innerHTML = `<h2>${esc(title)}</h2>${sub ? `<p class="ps">${sub}</p>` : ''}`; p.appendChild(el); return p; }

  async function show(day){
    $('day').value = day;
    const u = new URL(location.href); u.searchParams.set('day', day); history.replaceState(null, '', u);
    const body = $('body'); body.innerHTML = '<div class="dmsg">Loading…</div>';
    let prod, dt, bus, env, od;
    try {
      [prod, dt, bus, env, od] = await Promise.all([
        O.rpc(st, 'mm_llm_production', { p_from: day, p_to: day, p_by: 'day' }), O.rpc(st, 'mm_llm_downtime', { p_from: day, p_to: addDays(day, 1) }),
        O.rpc(st, 'mm_llm_bus_day', { p_day: day }), O.rpc(st, 'mm_llm_envoy', { p_term: null, p_from: day, p_to: day }),
        O.rpc(st, 'mm_llm_overdue_actions', { p_as_of: day })]);
    } catch (e) { body.innerHTML = `<div class="dmsg">${esc(e.message || e)}</div>`; return; }
    body.textContent = '';
    // the mill day runs 6 AM to 6 AM, mill time (same as the production row)
    const lo = day + 'T06', hi = addDays(day, 1) + 'T06';
    dt = dt.filter(x => { const k = millHour(x.starts_at); return k >= lo && k < hi; });
    const p = prod[0], nx = outages.find(o => o.starts >= day);
    const head = document.createElement('div'); head.className = 'dayh';
    head.innerHTML = `<h2>${new Date(day + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</h2>
      <span>${st.org.name} · mill day 6 AM to 6 AM${nx ? ` · next outage ${O.day(nx.starts)} (${Math.round((Date.parse(nx.starts) - Date.parse(day)) / 864e5)} days)` : ''}</span>`;
    body.appendChild(head);
    const unpl = dt.filter(x => x.kind === 'unplanned'), brk = dt.filter(x => x.kind === 'break');
    const tiles = document.createElement('div'); tiles.className = 'tiles';
    tiles.innerHTML = p ? [tile(O.num(p.tons), 'tons'), tile(O.num(p.uptime_pct, 1) + '%', 'uptime', p.uptime_pct < 95),
      tile(O.num(p.breaks), 'sheet breaks', p.breaks >= 4), tile(O.num(p.break_min), 'break minutes'),
      tile(O.num(p.unplanned_min), 'unplanned minutes', p.unplanned_min > 0), tile(O.num(p.planned_min), 'planned minutes'),
      tile(O.num(p.kwh_per_t, 1), 'refining kWh/t'), tile(O.num(p.steam_per_t, 2), 'steam t/t')].join('')
      : [tile(O.num(bus.length), 'BUS lines'), tile(O.num(env.length), 'Envoy exceptions'), tile(O.num(od.length), 'overdue actions')].join('');
    body.appendChild(tiles);
    if (!p) body.appendChild(Object.assign(document.createElement('p'), { className: 'dsub', textContent: 'No production or downtime feed for this organization on this day (Demo Mill doesn’t have one yet; Sim Mill does).' }));
    const g = document.createElement('div'); g.className = 'grid2';
    g.appendChild(panel('Stops and slowdowns', `${unpl.length} unplanned, ${brk.length} sheet break${brk.length === 1 ? '' : 's'}, ${dt.length - unpl.length - brk.length} other`,
      O.table(dt.filter(x => x.kind !== 'break').concat(brk.slice(0, 8)), [['starts_at', 'Start', 't'], ['minutes', 'Min', 'n'], ['kind', 'Kind', r => esc(KIND[r.kind] || r.kind)],
        ['equipment', 'Equipment'], ['cause', 'Cause'], ['rcfa_id', 'RCFA', r => r.rcfa_id ? `<span class="pill warn">${esc(r.rcfa_id)}</span>` : '']], 'No stops: a clean day.')));
    g.appendChild(panel('Envoy exceptions', 'Tags 3+ hours outside their 60-day ±3σ band during the day (the report arrives the next morning)',
      O.table(env, [['tag', 'Tag'], ['asset', 'Asset'], ['direction', 'Dir'], ['max', 'Max', 'n2'], ['hours_outside', 'Hours', 'n']], 'Nothing outside its band.')));
    body.appendChild(g);
    body.appendChild(panel(`BUS sheet (${bus.length} line${bus.length === 1 ? '' : 's'})`, 'The morning meeting’s list, carried day to day until each line closes',
      O.table(bus, [['area', 'Area'], ['equipment', 'Equipment'], ['issue', 'Issue'], ['action', 'Action / next step'], ['owner', 'Owner'],
        ['status', 'Status', r => `<span class="pill${r.status === 'New' ? ' warn' : r.status === 'Waiting parts' ? ' bad' : ''}">${esc(r.status)}</span>`], ['days_open', 'Days', 'n'], ['wo_no', 'WO']],
        'No BUS sheet for this day.')));
    body.appendChild(panel(`Overdue actions (${od.length})`, 'Planner actions past due and not completed, as of this day',
      O.table(od, [['task_id', 'ID'], ['title', 'Action'], ['assigned_to', 'Owner'], ['due', 'Due', 'd'], ['days_late', 'Days late', 'n']], 'Nothing overdue.')));
  }

  $('prev').onclick = () => show(addDays($('day').value, -1));
  $('next').onclick = () => show(addDays($('day').value, 1));
  $('toToday').onclick = () => show(today);
  $('day').onchange = () => $('day').value && show($('day').value);
  async function start(){
    today = await O.today(st);
    const ctx = await st.db.rpc('mm_llm_context', { p_org: st.org.id });
    outages = ((ctx.data && ctx.data.outages) || []).map(o => ({ id: o.id, starts: o.starts }));
    const want = new URLSearchParams(location.search).get('day');
    show(want && /^\d{4}-\d{2}-\d{2}$/.test(want) ? want : today);
  }
  (async () => {
    st = await O.resolve();
    if (st.error){ $('body').innerHTML = `<div class="dmsg">${esc(st.error)}</div>`; return; }
    O.picker($('org'), st, start);
    start();
  })();
</script>
<script src="mm-nav.js?v=2026-11-08.2126"></script>
</body>
</html>
