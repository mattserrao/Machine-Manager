id: S08
title: Action backlog growing after the annual outage
summary: >
  After the annual outage, actions from the outage punch list, RCFAs and BUS are logged faster than they
  close. By Oct 31, 14 actions are overdue, several with no owner update in over 3 weeks, and two WOs
  for Nov 11 have no parts reserved.
positions: []
assets: [PM1 Press section, PM1 2nd dryer section]
pi_tags: []
outages: [OUT-2026-ANNUAL, OUT-2026-11-11]
people: [P01, P02, P05]
vendors: []
timeline:
  - date: 2026-10-12
    sources: [teams]
    what: About 40 annual outage punch-list actions are logged in two days.
  - date: 2026-10-26
    sources: [teams, jde, bus]
    what: Overdue count passes 10; BUS sheet carries 3 items "waiting on parts".
  - date: 2026-10-31
    sources: [teams, jde]
    what: 14 actions overdue; 2 Nov 11 WOs without reserved parts (one is the can 27 bearing).
demo_questions:
  - q: What needs an owner or a push before Monday's BUS meeting?
    output: Morning watch
    expect: Lists the 14 overdue actions by owner, flags the 2 Nov 11 WOs without parts, and links the can 27 bearing.
