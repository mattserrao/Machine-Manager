id: S02
title: 2nd press felt filling early — plugged HP shower nozzles
summary: >
  In March the 2nd press felt fills faster than normal: Uhle box vacuum and press-out moisture rise and
  the dryers run out of steam on 33#. The Apr 15 felt survey shows high fill, the shower audit finds
  plugged nozzles on the 2nd press HP shower, and an RCFA follows. One RCFA action is still open.
positions: [p2-felt-top]
assets: [2nd press top felt, 2nd press top felt Uhle box, 2nd press top felt HP shower, 3rd section steam & condensate]
pi_tags: [PM1:UHLE_P2_VAC, PM1:PRESS_OUT_MOIST, PM1:DRY3_STEAM_P, PM1:SPEED]
outages: [OUT-2026-03-04, OUT-2026-04-15]
people: [P04, P01, P05, P09]
vendors: [V-HF, V-SN]
timeline:
  - date: 2026-03-04
    sources: [mm, jde]
    what: New 2nd press felt installed at the outage (planned 12-week life).
  - date: 2026-03-10
    sources: [pi]
    what: Uhle vacuum starts climbing ~0.1 inHg/day; press-out moisture creeps up.
  - date: 2026-03-16
    sources: [bus, pi]
    what: '"Steam limited on 33#, slowed 40 fpm" — repeats most 33# days for four weeks.'
  - date: 2026-03-24
    sources: [envoy]
    what: Envoy flags 3rd section steam at maximum and Uhle box vacuum high.
  - date: 2026-03-27
    sources: [bus, teams]
    what: Process engineer asks Halden for a felt survey at the next outage; action logged.
  - date: 2026-04-15
    sources: [vendor, mm, jde]
    what: Felt pulled at 6 weeks. Halden survey shows high fill; Spraywell audit finds 18% of 2nd press HP shower nozzles plugged.
  - date: 2026-04-22
    sources: [rcfa, teams]
    what: RCFA-2026-03 opened. Cause is plugged nozzles and a nozzle PM that was too infrequent. Actions are a monthly nozzle check, a strainer upgrade and filtered shower water (still open).
  - date: 2026-05-27
    sources: [jde]
    what: Shower strainer upgrade done at the outage.
demo_questions:
  - q: We're steam limited on 33# again and Uhle vacuum is creeping up. What should we check?
    output: Troubleshooting
    expect: Points to the March–April event, plugged 2nd press HP shower nozzles, RCFA-2026-03, and the still-open filtered water action.
  - q: Why did the 2nd press felt come off early in April?
    output: Ask MM
    expect: High fill from plugged HP shower nozzles (survey and audit of Apr 15), pulled at 6 of 12 weeks.
