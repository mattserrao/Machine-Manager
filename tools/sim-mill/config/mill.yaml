# Clothing, plates and rolls: target life (weeks), vendor and style. Felts and fabrics change at outages; the model
# picks the outage nearest the target (or the one before, if the position is worn). `phase` = the outage index (0 =
# Sep 17 2025) the current piece went on before the year starts, so changes land through the year.
positions:
  ref-refa:       { kind: refiner, life_w: 12, vendor: Ridgeway Refining, style: "34\" LC plate, 3.0/4.0 bar/groove", phase: 0 }
  ref-refb:       { kind: refiner, life_w: 12, vendor: Ridgeway Refining, style: "34\" LC plate, 3.0/4.0 bar/groove", phase: 1 }
  form-bottom:    { kind: fabric,  life_w: 12, vendor: Northbank Fabrics, style: NX-1850 double layer, phase: 0 }
  p1-felt-top:    { kind: fabric,  life_w: 12, vendor: Halden Felt Co., style: "Seamed felt, 1300 gsm", phase: 1 }
  p1-felt-bottom: { kind: fabric,  life_w: 12, vendor: Halden Felt Co., style: "Endless felt, 1500 gsm", phase: 0 }
  p2-felt-top:    { kind: fabric,  life_w: 6,  vendor: Marlow Press Fabrics, style: "Seamed felt, 1400 gsm", phase: 1 }
  p2-felt-bottom: { kind: fabric,  life_w: 12, vendor: Marlow Press Fabrics, style: "Endless felt, 1600 gsm", phase: 1 }
  p1-roll-top:    { kind: roll, life_w: 104, vendor: Pellham Roll Service, style: Composite cover, since: 2025-02-26 }
  p1-roll-bottom: { kind: roll, life_w: 78,  vendor: Pellham Roll Service, style: "Suction roll, rubber 10 P&J", since: 2025-06-04 }
  p2-roll-top:    { kind: roll, life_w: 104, vendor: Pellham Roll Service, style: Granite-style composite cover, since: 2024-12-11 }
  p2-roll-bottom: { kind: roll, life_w: 78,  vendor: Pellham Roll Service, style: "Blind-drilled rubber, 12 P&J", since: 2025-03-12 }
  d1-felt:        { kind: fabric, life_w: 52, vendor: Northbank Fabrics, style: "Dryer fabric, spiral seam", since: 2025-03-12 }
  d2-felt:        { kind: fabric, life_w: 52, vendor: Northbank Fabrics, style: "Dryer fabric, pin seam", since: 2025-06-04 }
  d3-felt:        { kind: fabric, life_w: 65, vendor: Corrie Textiles, style: "Dryer fabric, spiral seam", since: 2025-04-23 }
  d4-felt:        { kind: fabric, life_w: 65, vendor: Corrie Textiles, style: "Dryer fabric, spiral seam", since: 2025-07-16 }
felt_roll: { life_w: 156, vendor: Pellham Roll Service, style: "Felt roll, rubber cover, sealed bearings" }

consumables:
