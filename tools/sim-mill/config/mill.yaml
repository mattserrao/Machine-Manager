# Sim Mill — the mill the data-generating model runs. This is The Paper Mill's own recycled-board mill (the game's
# machine, grades, critical assets and upsets: see reference/catalog.json, exported from the-paper-mill sim-headless),
# set up as a Machine Manager organization. Every person and company is fictional.

org: Sim Mill
machine:
  name: PM1
  # My Machine setup (mm-machine.js): fourdrinier, 2 press nips (not tandem), 4 uno-run dryer sections of 5 cans,
  # each with 5 felt rolls tracked as roll positions, no calender, twin refiners.
  former: { type: fourdrinier, lumpbreaker: false }
  press: { nips: 2, tandem: false }
  dryers:
    - { type: uno, feltRolls: 5 }
    - { type: uno, feltRolls: 5 }
    - { type: uno, feltRolls: 5 }
    - { type: uno, feltRolls: 5 }
  calender: false
  refiners: [{ id: refa, name: REF 1 }, { id: refb, name: REF 2 }]
  cans_per_section: 5

year:
  warmup_start: 2025-09-01      # the model runs from here so Bonvoy has a baseline on day one
  start: 2025-11-01
  today: 2026-10-31             # demo "today"
  end: 2026-11-01

outages:
  anchor: 2026-11-11            # the 6-week grid, as Demo Mill and Outage Planning
  cadence_days: 42
  start_hour: 6
  hours: 20

# Grades: the game's (02-audio GRADES and GCOST). sp = full speed (fpm), bw = lb/1000 ft2, brk = break hazard factor,
# steam = steam demand factor, mix = campaign size range (t). The planner walks the wheel 24 > 28 > 31 > 34Super > 31.
grades:
  "24":      { label: 24#,      sp: 2632, bw: 25.52, brk: 1.15, steam: 1.00, mix: [2600, 3600] }
  "28":      { label: 28#,      sp: 2262, bw: 28.03, brk: 1.25, steam: 1.02, mix: [80, 160] }
  "31":      { label: 31#,      sp: 2147, bw: 31.10, brk: 0.75, steam: 1.14, mix: [150, 350] }
  "34Super": { label: 34 Super, sp: 2027, bw: 34.01, brk: 0.55, steam: 1.11, mix: [800, 1300] }
wheel: ["24", "28", "31", "34Super", "31"]
k_tph: 0.0005180989223542414    # t/h = k * fpm * bw (the game's P.K: 34.8 t/h on 24 at 2,632 fpm)

# Realism retune (agreed targets: 1-3 breaks a day; unplanned stops over 1 h: 15-25 a year from the engine, 30-45 with the
# developing failures of simmill/degrade.py (agreed Nov 9); 10-30 RCFAs).
# Reference year (JS) used MTBF x 45 (its own chaos and reliability multipliers add stops); the port uses x 30 and break hazard x 2.5 on the game's season-tuned values.
rates:
  upset_mtbf_x: 30
  breaks_per_day: 1.55          # mean on 24 (grade factors scale it)
  rcfa_min_hours: 3             # an unplanned stop this long (or the 2nd of a kind in 60 days) gets an RCFA

