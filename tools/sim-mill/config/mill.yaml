  - { name: "2nd press top felt (Marlow, 1400 gsm)", qty: 2, min: 1, unit: felts }
  - { name: "Forming fabric NX-1850", qty: 1, min: 1, unit: fabrics }
  - { name: "Dryer felt roll bearings", qty: 6, min: 4, unit: bearings }
  - { name: "Rotary joint seal kits (Brightwater)", qty: 1, min: 2, unit: kits, note: "3rd section joint leaks used two" }
  - { name: "Reel drum DS bearing (22238)", qty: 0, min: 1, unit: bearings, note: "On order" }
  - { name: "HP shower nozzles (2nd press)", qty: 140, min: 60, unit: nozzles }
